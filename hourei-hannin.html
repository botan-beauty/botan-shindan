    why:"食いしばると、頬の横の咬筋（こうきん）がずっと緊張してパンパンに。硬くなった筋肉の下は血液もリンパも流れにくうなって、首や肩まで巻き込んでガチガチに。支えを失った頬が下がって、その境目にほうれい線がくっきり出てくるんよ🌙",

    study:[{n:"エラボトックス",s:5,d:"咬筋の働きを弱めて、食いしばりを軽減する目的で行われます。"},{n:"ヒアルロン酸",s:3,d:"ほうれい線の溝を補う方法として選ばれることがあります。"},{n:"HIFU・RF",s:2,d:"たるみが強い場合、組み合わせて行うこともあります。"}],
    redpen:"⭕️エラボトックスは効く！ でもな😊 たるみ世代や皮膚がやわらかいタイプは要注意。筋肉が小さくなるぶん皮膚が下がって「濃くなった…」て感じる人も、実際に見てきました。それにボトックスは筋肉をゆるめるだけ。「食いしばるクセ」までは治してくれへん。脳が「頑張らなきゃ」を覚えたままやと、また違う筋肉に力が入るんよ。だから私は、なんで食いしばるようになったんやろ？ そこを一緒に考えます🌙",

    redpen:"❌ちょっと待って😊 むくみだけなら、高い施術がいらん人も多いんよ。余分な水分がたまってるだけなのに、いきなりハイフで焼くのはもったいないことも。原因は呼吸の浅さ・冷え・巡り不足やったりする。まず巡りを戻すだけで、翌朝「顔ちっちゃ！」ってなる人、何人も見てきました🌸",
    brain:"むくみやすい人って、意外と頑張り屋さんが多い。緊張すると呼吸が浅なって、肩に力が入って、巡りまで止まる。だからむくみを見る時も、肩や呼吸、脳の疲れまで一緒に見てるんよ🌸"
  },
  meg:{
    why:"血液やリンパの巡りが悪なると、肌に必要な酸素も栄養も届きにくうなる。すると肌を支えるコラーゲンも元気をなくして、ハリも弾力も低下。老廃物も溜まって、顔全体がどんより疲れて見えるんよ。ほうれい線は「巡りがお休み中」のサインかも🌙",
    signs:["顔色が悪いと言われる","くすみ・クマができやすい","手足が冷えやすい","運動不足・座りっぱなし","肩こり・首こりがある","疲れると一気に老けて見える"],
    study:[{n:"肌育治療",s:4,d:"肌の再生力を高める目的で行われます。"},{n:"IPL・光治療",s:4,d:"血色や肌全体のトーン改善を目指します。"},{n:"レーザートーニング",s:4,d:"くすみ改善や透明感アップを目的に行われます。"}],
    redpen:"⭕️施術もいい😊 でもな、生活の巡りを無視したままやと、もったいないことも。どれだけ高い肌育治療を受けても、寝不足・冷え・浅い呼吸の毎日やと、肌へ届く栄養も少なくなる。私は施術の前に、まず「巡れる身体」を作る方が結果も長持ちすると感じてます🌸",

    study:[{n:"ピーリング",s:3,d:"古い角質を取り除き、ターンオーバーを促します。"},{n:"美容点滴",s:3,d:"抗酸化成分を補う目的で行われます。"},{n:"肌育治療",s:3,d:"肌質改善を目的として組み合わせることがあります。"}],
    redpen:"⭕️施術も悪くない😊 でも本丸は毎日の食事と睡眠。ピーリングや美容点滴をしても、糖をたくさん摂って夜更かししてたら、また新しい「焦げ」を作ってまう。だから施術の前に、まず毎日の生活を少しだけ見直してほしい。夜の甘いものを一つ減らす、それだけでも未来のお肌は変わり始めるよ🌸",
    brain:"疲れた時ほど甘いものが食べたくなる、そんな経験ない？ 実はそれ、心が疲れてるサインかも。脳が疲れる→甘いものを欲しがる→糖化が進む→肌にも出る。だから食事だけやなく、脳の疲れも一緒に見てるんよ🌸"
  },
  kok:{
    why:"「骨格やから仕方ない」て思われがちやけど、年齢とともに骨も少しずつ変化する。頬骨や上あごの骨のボリュームが減ると、その上に乗ってる脂肪や皮膚を支えきれんくなって頬が下がる。だからほうれい線が目立ちやすうなるんよ🌙",
    signs:["昔から面長と言われる","頬がこけやすい","痩せると一気に老けて見える","頬にボリュームが少ない","若い頃からほうれい線が気になってた","肌はそこまで悪くないのに老けて見える"],
    study:[{n:"ヒアルロン酸",s:5,d:"骨の減少や凹みにボリュームを補い、リフトアップを目指します。"},{n:"糸リフト",s:4,d:"皮膚や脂肪を引き上げる施術として選ばれることがあります。"},{n:"外科的リフト",s:4,d:"たるみが強い場合の選択肢になります。"}],
    redpen:"❌ちょっと待った😊 ヒアルロン酸は、入れれば入れるほど若返る…そんな魔法の注射やないんよ。脂肪が多いタイプや厚肌タイプは、逆に顔が重なってたるみが目立つことも。骨が痩せたタイプなら、深い層へ入れると自然に若々しく見える。同じヒアルでも、誰に・どこへ・どう入れるかで結果は全然ちがう。だから私は「どの犯人が主犯か」を先に見極めます🌸",
    // 骨格は締めを希望寄りに（ちゃぴ案採用）
    brain:"骨格は、唯一、生まれ持った個性も関係する。でもな、私は15年間、骨格「だけ」が原因やった人を見たことがありません。その上に乾燥・巡り・むくみ・食いしばりが重なることで、ほうれい線は何倍も目立ってまう。だから骨格を責める必要なんてないんよ😊 変えるんは骨やのうて、上に乗った犯人たち。そこをゆるめたら、印象はちゃんと変わる🌸"
  },
  nou:{ // 脳疲労が主犯（＝黒幕がそのまま前に出たレアケース）
    why:"脳がずっと緊張してると、身体は無意識に「戦闘モード」に。呼吸は浅く、肩や首は硬く、食いしばりも増える。血流もリンパもゆっくりになって、肌へ酸素も栄養も届きにくうなる。今まで出てきた犯人たちは、みんなこの脳疲労の影響を受けてることが多いんよ🌙",
    signs:["考え事が止まらない","寝ても疲れが取れない","頑張るのが当たり前","「ちゃんとしなきゃ」が口ぐせ","肩こり・首こりがひどい","何をしてもスッキリしない"],
    study:[{n:"美容医療 単独",s:2,d:"特定の施術だけでの改善は難しく、原因に合わせた総合的なケアが勧められます。"},{n:"睡眠・ストレスケア",s:5,d:"生活習慣や睡眠の改善は、美容医療と合わせて勧められることが多いです。"}],
    redpen:"❌肌だけ治療しても満足できへん人がおる。それがこの犯人😊 いつも頭はフル回転、「もっと頑張らな」の毎日やと、身体は休んでるつもりでも脳は一度も休憩できてへん。どれだけ高い施術を受けても「なんか違う…」て美容難民になりやすい。だから私は、肌だけやなく脳の力みまで一緒に見てます🌸",
    brain:"これが、私がずっと伝えたかったこと。肌だけ見ても全部は分からへん。脳だけ見ても分からへん。でも肌と脳を一緒に見ると、「なんで今まで変わらんかったんやろ？」が少しずつつながる。だから私は、肌と脳は双子、そう伝えてるんよ🌸"
  }
};

/* ===== 黒幕（固定・脳疲労）＝主犯が脳疲労以外の時、最後に必ず出す ===== */
const BOSS = {
  emoji:"🧠",
  name:"脳疲労犯",
  text:"犯人は違っても、私が15年間見てきて共通してたことがあるんよ。<br><br>どの犯人も、最後は<b>「脳の疲れ」</b>に影響されてることが多かった。<br><br>だから私は、この犯人を<b>黒幕</b>って呼んでる🌙"
};

/* ===== AIぼたんURL（※本番のURLに差し替えてな） ===== */
const AI_BOTAN_URL = "https://botan-shindan.pages.dev/ai_botan_final.html";

/* ================= ロジック ================= */
let cur = 0;
const answers = new Array(QUESTIONS.length).fill(null);

function render(){
  const item = QUESTIONS[cur];
  const card = document.getElementById('card');
  card.classList.remove('fade'); void card.offsetWidth; card.classList.add('fade');
  document.getElementById('qnum').textContent = "QUESTION " + (cur+1);
  document.getElementById('qtext').textContent = item.q;
  document.getElementById('fill').style.width = ((cur)/QUESTIONS.length*100) + "%";
  document.getElementById('ptext').textContent = (cur+1) + " / " + QUESTIONS.length;
}
function answer(yes){
  answers[cur] = yes;
  if(cur < QUESTIONS.length-1){ cur++; render(); }
  else { showResult(); }
}
function goBack(){
  if(cur>0){ cur--; render(); }
}

function tally(){
  const score = {kui:0,muk:0,meg:0,hik:0,kan:0,tou:0,kok:0,nou:0};
  QUESTIONS.forEach((item,i)=>{ if(answers[i]) score[item.c]++; });
  return score;
}

function decide(score){
  // 主犯・共犯を決める。脳疲労は原則 黒幕へ温存（他に得点がある限り主犯/共犯にしない）
  const entries = Object.entries(score); // [code,点]
  // 脳疲労を除いた順位
  const noBoss = entries.filter(e=>e[0]!=="nou").sort((a,b)=>b[1]-a[1]);
  const bossScore = score.nou;
  const nonBossTotal = noBoss.reduce((s,e)=>s+e[1],0);

  let mainCode, subCode=null;

  if(nonBossTotal===0){
    // 脳疲労しか点がない（or 全部0）→ 脳疲労が主犯として前に出るレアケース
    mainCode = "nou";
  } else {
    mainCode = noBoss[0][0];
    // 共犯＝2位（点が1以上のものだけ）
    if(noBoss[1] && noBoss[1][1] > 0) subCode = noBoss[1][0];
  }
  return {mainCode, subCode, bossScore, score};
}

function showResult(){
  document.getElementById('fill').style.width = "100%";
  const {mainCode, subCode} = decide(tally());
  const main = HANNIN[mainCode];
  const r = RESULT[mainCode];

  let html = '<div class="fade">';

  // HERO
  html += '<div class="r-hero">';
  html += '<div class="case">CASE FILE</div>';
  html += '<div class="emoji">'+main.emoji+'</div>';
  html += '<div class="name">'+main.name+'</div>';
  html += '<div class="lead">あなたの主犯は、この子やった🕵️‍♀️</div>';
  html += '</div>';

  // なぜ
  html += '<div class="r-block"><h3>🔍 なんでほうれい線になるん？</h3><p>'+r.why+'</p></div>';

  // あるある
  html += '<div class="r-block"><h3>✅ あなたによくある特徴</h3><ul class="checklist">';
  r.signs.forEach(s=> html += '<li>'+s+'</li>');
  html += '</ul></div>';

  // 一般論の教科書（施術＋★）
  if(r.study && r.study.length){
    html += '<div class="r-block"><h3>💉 一般論の教科書</h3>';
    r.study.forEach(function(t){
      var stars = "★★★★★☆☆☆☆☆".slice(5-t.s, 10-t.s);
      html += '<div style="padding:11px 0;border-bottom:1px dashed var(--line);">'
           +  '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">'
           +  '<b style="font-size:15px;">'+t.n+'</b>'
           +  '<span style="color:var(--accent);font-size:14px;letter-spacing:2px;white-space:nowrap;">'+stars+'</span></div>'
           +  '<p style="margin:5px 0 0;font-size:13.5px;color:var(--sub);">'+t.d+'</p></div>';
    });
    html += '<p style="font-size:12px;color:var(--sub);margin:10px 0 0;">※あくまで一般的な目安やよ🌙 合うかどうかは、犯人によって変わるんよ😊</p></div>';
  }

  // 赤ペン
  html += '<div class="r-block redpen"><h3>👩‍⚕️ ぼたんの赤ペン先生✍️</h3><p>'+r.redpen+'</p><p style="color:var(--sub);font-size:13px;">🌿この施術が合うかは、犯人が誰かで変わるんよ😊</p></div>';

  // チーム（主犯＋共犯）
  html += '<div class="r-block"><h3>🌙 実は、共犯もおる</h3><div class="team">';
  html += '<div class="team-row"><div class="rank">🥇 主犯</div><div class="who">'+main.emoji+' '+main.name+'</div></div>';
  if(subCode){
    const sub = HANNIN[subCode];
    if(subCode==="kok"){
      // 骨格が共犯位＝"土台"として表示（悪役にしない・希望寄り）
      html += '<div class="team-row" style="background:linear-gradient(180deg,#f3eee9,#ece4da);"><div class="rank">🦴 土台</div><div class="who">'+sub.emoji+' 骨格<small>生まれ持った形やから、責めんでええよ😊 その上に乗った主犯をゆるめるだけで、印象は変わる🌸</small></div></div>';
    } else {
      html += '<div class="team-row"><div class="rank">🥈 共犯</div><div class="who">'+sub.emoji+' '+sub.name+'<small>'+sub.short+'</small></div></div>';
    }
  }
  html += '</div></div>';

  // 黒幕（主犯が脳疲労でない時だけ・固定）
  if(mainCode!=="nou"){
    html += '<div class="r-block boss"><h3>👑 そして、黒幕は…</h3><p style="text-align:center;font-size:34px;margin:6px 0;">'+BOSS.emoji+'</p><p style="text-align:center;font-size:18px;font-weight:800;color:var(--accent2);margin-bottom:12px;">'+BOSS.name+'</p><p>'+BOSS.text+'</p></div>';
  }

  // 肌と脳は双子
  html += '<div class="r-block"><h3>🧠 肌と脳は双子</h3><p>'+r.brain+'</p></div>';

  // それ、ほんとなん？
  html += '<div class="r-block honto"><p>あなたは「ほうれい線は年齢やから仕方ない」って思ってたかもしれへん。</p><p class="big">……それ、ほんとなん？😊</p><p>年齢だけでは説明できひんことを、美容ナースとして15年、ほんまにたくさん見てきました🌙</p></div>';

  // ぼたんから一言
  html += '<div class="r-block"><h3>💜 ぼたんから一言</h3><p>犯人探しがしたかったんやない。責めたかったんでもない。ほんまに伝えたかったのは──あなたは壊れてない。ただ、少し巡りが止まってただけ🌸</p><p>力を抜くたびに、肌も人生も、また巡り始める。<br><b>元々、最高やったやん🤣💜</b></p></div>';

  // CTA → AIぼたん
  html += '<a class="cta" href="'+AI_BOTAN_URL+'">🌙 この結果を持って、AIぼたんに会いにいく</a>';
  html += '<p style="text-align:center;color:var(--sub);font-size:13px;margin-top:-2px;">あなたの犯人チームの全貌は、AIぼたんが教えてくれるよ💜</p>';

  html += '<div class="restart"><button onclick="restart()">もう一回やってみる</button></div>';
  html += '<div class="foot">© ぼたん / めぐる<br>無断複製・転載を禁じます。</div>';
  html += '</div>';

  document.getElementById('quiz').style.display = "none";
  const res = document.getElementById('result');
  res.innerHTML = html;
  res.style.display = "block";
  window.scrollTo(0,0);
}

function restart(){
  cur = 0;
  for(let i=0;i<answers.length;i++) answers[i]=null;
  document.getElementById('result').style.display="none";
  document.getElementById('result').innerHTML="";
  document.getElementById('quiz').style.display="block";
  render();
  window.scrollTo(0,0);
}

render();
</script>
</body>
</html>
