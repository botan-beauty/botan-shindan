    botan:`頑張り屋さんほど、肝斑になりやすい。それって、あなたがずっと一生懸命やってきた証拠でもあるんよ🌸 まずは今夜、スキンケアを1つ減らして、いつもより早く休んでみて。肌も、あなたも、"ゆるむ"ほどめぐりだすから🌙` },
  B:{ toku:`小さい茶色い点がポツポツ増えたり、昔よりシミが濃くなってきたなら、このタイプ。紫外線でメラニンが生まれてる状態やけど——焼けた後の48時間は"リカバリータイム"。ここでちゃんとケアしたら、メラニンが定着する前に手を打てるんよ。だから「もう遅い」やのうて、今からでも間に合う🌸`,

    seibun:`成分：ビタミンC誘導体／ハイドロキノン／トラネキサム酸／ナイアシンアミド\nケア：UV対策を強化、ブライトニング美容液\n「浴びない」×「早めに鎮める」の合わせ技🌸`,
    hitokoto:`焼けた後の48時間って、じつは"やり直せる時間"なんよ🌞 冷やして、鎮めて、保湿する。それだけでメラニンの定着を防げる。過ぎたことより、今日からできることに目を向けよ🌸`,
    nou:`紫外線シミみたいな"浅いシミ"は、実はケシミンみたいな市販品でも薄くなることがあるんよ。うちのおかんな、「ケシミンで消えたわ！」ってご機嫌でな😂 でもわたし思うんよ——効いたんは成分だけやない。「これで消える」って信じて塗ってた、その"脳"も一緒に効いてたんちゃうかって🌸 高い化粧品やのうても、"信じて使う"と肌は応えてくれる。それくらい、肌と脳はつながってる（双子なんよ）🌙`,
    botan:`日焼け止めって、めんどくさいよね🌸 でもね、朝の歯磨きと同じ"当たり前"にできたら、それだけで未来の肌が変わるんよ。完璧やなくていい。塗り忘れた日があっても、また今日から。肌はいつでも、あなたの味方やから🌙` },
  C:{ toku:`肌が赤くなりやすい、ニキビ跡が残る、なんとなく顔色が暗い……そんなあなたはこのタイプ。原因の多くは"無意識の摩擦"。ゴシゴシ洗顔、強いクレンジング、毛穴を触る癖——ひとつひとつは小さくても、積み重なると炎症→くすみ→色素沈着につながるんよ。でも裏を返せば、触り方を変えるだけで肌は応えてくれる🌸`,

    seibun:`成分：グリチルリチン酸2K／セラミド／アラントイン／ツボクサエキス\nケア：低刺激・保湿クレンジング、保湿マスク\n「足す」より「刺激を引く」が近道🌸`,

  D:{ toku:`化粧したまま寝ちゃう、お風呂キャンセルしがち、とにかく疲れてる……そんなあなたはこのタイプ。これはサボりやのうて、あなたがそれだけ頑張ってる証拠なんよ。肌は「回復」できてはじめて整うもの。やる気を出す前に、まず休むことが必要なだけ🌸`,

    botan:`毎日、ほんまにお疲れさま🌸 ケアする気力もない日があるの、それだけ全力で生きてる証拠やで。今日は何もせんでいい。顔拭いて、早よ寝よ。あなたが休むほど、肌もちゃんと戻ってくるから🌙 だいじょうぶ、伸びしろしかないよ。` },
  E:{ toku:`グレーっぽい・青黒い色味が、頬骨のあたりに左右対称に出る……そんなあなたはこのタイプかも。シミはな、"色がどの深さにあるか"で、届くケアが全然ちがうんよ。紫外線シミは浅い層。でもADMは"真皮"っていう深い層にメラニンがある。だから、どんなに表面を頑張っても届きにくい。これが「ケアしても変わらへん」の正体なんよ。しかも肝斑とめちゃくちゃ間違われやすい。「頑張っても変わらへん…」って自分を責めてきた人ほど、ケアが悪いんやのうて、タイプが違ってただけかもしれん🌸`,

    hitokoto:`「ちゃんとケアしてるのに変わらへん」——それ、あなたのせいやないかもしれん🌸 ADMは化粧品では届かへん深さにあるから、まず"正しく知る"ことが何より大事。責めるより、見極めよ🌙`,
    nou:`ADMさんは、"見た目じゃ分かりにくい・深いところにある"のが特徴。それって、「頑張ってるのに報われへん」と一人で抱え込みやすい気質とも重なるんよ。焦って表面をなんとかするより、まず"正しく見てもらう"=委ねるのも、めぐりの第一歩🌙`,
    botan:`ずっと「なんで変わらへんの」って頑張ってきたんやね🌸 それはあなたの努力不足やのうて、ただ"タイプ"が違ってただけ。ここからは一人で抱えんでええよ。あなたのシミ、もっとちゃんと見極めたいから——あとはぼたんに直接聞いて❤️` },

function Fairy({node, ftype, side}){

  else {                    outerAnim="tsukIdle 4.6s ease-in-out infinite"; innerAnim="tsukIn 1.15s cubic-bezier(.2,.8,.3,1) both"; }
  return (
    <div className="fu" data-fairy style={{display:"flex",flexDirection:right?"row-reverse":"row",
      gap:12,alignItems:"center",
      background:"linear-gradient(135deg,rgba(224,201,228,.16),rgba(216,190,134,.12))",
      border:`1px solid ${C.line}`,borderRadius:16,padding:"12px 14px",margin:"0 0 16px"}}>
      <div style={{flexShrink:0,width:size,animation:outerAnim,
        filter:"drop-shadow(0 3px 8px rgba(255,255,255,.55)) drop-shadow(0 6px 12px rgba(184,127,192,.14))"}}>

function App(){
  const [screen,setScreen]=useState("intro"); // intro, quiz, reveal, result
  const [i,setI]=useState(0);
  const [score,setScore]=useState({});
  const [winner,setWinner]=useState(null);
  const [copied,setCopied]=useState(false);

  const begin=()=>{ setI(0); setScore({}); setWinner(null); setCopied(false); setScreen("quiz"); };

  const answer=(yes)=>{
    const t=Q[i][1];
    const ns={...score};
    if(yes) ns[t]=(ns[t]||0)+1;
    if(i+1>=Q.length){
      const order=["A","B","C","D","E","F","G","H"];
      let best=order[0], bv=-1;
      order.forEach(k=>{ const v=ns[k]||0; if(v>bv){bv=v;best=k;} });
      setScore(ns); setWinner(best); setScreen("reveal");
    }else{ setScore(ns); setI(i+1); }
  };

  // 🔗 シェア（＝簡易版のURLを配る）
  const share=()=>{
    const r=R[winner];
    const text=`🪞 鏡が映した、わたしの肌は【${r.name}】${r.animal}\n「${r.word}」\n\nあなたはどの鏡に映る？\nまずは、はじめの鏡から✨\n👇\n${LITE_URL}\n\nくわしい特徴・ケア・"肌と脳は双子"の話は、ぼたんのLINEで💚\n${LINE_URL}`;
    if(navigator.share){
      navigator.share({title:"鏡をひらく物語｜シミ診断", text:text}).catch(()=>{});
    }else{
      navigator.clipboard.writeText(text).then(()=>{
        setCopied(true); setTimeout(()=>setCopied(false),2400);
      }).catch(()=>{});
    }
  };

  // INTRO
  if(screen==="intro"){
    return (<div style={bg}><Ambient/>
      <div style={{position:"relative",zIndex:1,maxWidth:470,margin:"0 auto",textAlign:"center"}} className="fu">
        <div className="serif" style={{fontSize:11,letterSpacing:".34em",color:C.gold,marginBottom:14}}>真実の鏡 〜True Mirror〜</div>
        <div style={{fontSize:22,marginBottom:6}}>🪞</div>
        <h1 className="serif" style={{fontSize:26,lineHeight:1.7,letterSpacing:".06em",fontWeight:500,margin:"0 0 8px"}}>
          勇気を出して、<br/>鏡に自分を映してみない？
        </h1>
        <div style={{width:38,height:1,background:C.goldSoft,margin:"16px auto 18px"}}/>
        {/* 物語のはじまり＝ホール（広間に立つ） */}
        <div style={{width:"100%",borderRadius:20,marginBottom:20,border:`1px solid ${C.line}`,
          background:"linear-gradient(135deg,#FBF3E4,#F5EAF3,#FBF0EC)",padding:8,
          boxShadow:"inset 0 0 34px rgba(255,255,255,.6)"}}>
          <img src={HALL} alt="鏡の間" style={{width:"100%",display:"block",borderRadius:13}}/>
        </div>
        <div style={{...card,textAlign:"left"}}>
          <div className="serif" style={{fontSize:10,letterSpacing:".26em",color:C.gold,marginBottom:14}}>― ある噂話 ―</div>
          <p className="serif" style={{fontSize:14.5,lineHeight:2.2,color:C.ink,margin:0}}>
            「ねぇ、ご存知？<br/>
            　<b style={{color:C.lav}}>合言葉</b>を唱えると、鏡が<b style={{color:C.gold}}>美肌の秘密</b>を教えてくれる館があるんですって」<br/><br/>
            「まあ……そんな夢みたいなお話が？」<br/><br/>
            「ええ。<b style={{color:C.gold}}>8つの鏡</b>をめぐると、最後に<b style={{color:C.lav}}>“ほんとうの自分の肌”</b>を映してくださるとか。<br/>
            　あの、いつもお綺麗な方も……通っていらっしゃるそうよ」<br/><br/>
            「まあ素敵……。<br/>
            　でもね、聞いたところによると——<b style={{color:C.lav}}>見たくないお肌</b>まで、ぜんぶ映されてしまうんですって」<br/><br/>
            「……<b style={{color:C.lav}}>それでも、知りたいわ</b>。<br/>
            　わたくし、行ってみたいの」
          </p>
        </div>

        {/* AIぼたん登場＋合言葉を教える（部屋で唱えるため） */}
        <div style={{...card,textAlign:"left",marginTop:16,
          background:"linear-gradient(135deg,rgba(224,201,228,.2),rgba(216,190,134,.14))"}}>
          <div style={{display:"flex",gap:12,alignItems:"center",marginBottom:12}}>
            <img src={FAIRY_IMG} alt="AIぼたん" onError={(e)=>{e.target.style.display='none';}}
              style={{width:62,flexShrink:0,display:"block"}}/>
            <div>
              <div className="serif" style={{fontSize:15,color:C.lav,fontWeight:600}}>AIぼたん</div>
              <div style={{fontSize:11,color:C.inkSoft}}>今日の案内役・ぼたんの分身</div>
            </div>
          </div>
          <p className="serif" style={{margin:0,fontSize:14,lineHeight:2,color:C.ink}}>
            あら、<b style={{color:C.lav}}>いらっしゃい</b>🌙<br/>
            美肌になりに、来てくれたんやね💕 わたし、<b style={{color:C.lav}}>AIぼたん</b>。今日あなたを、8つの鏡の間へ案内するね。<br/><br/>
            ただね……鏡は、<b style={{color:C.gold}}>合言葉</b>を唱えんと答えてくれへんの。
            お部屋に入るたびに、いっしょに唱えよな。
            ……<b>忘れんといてね？</b>
          </p>
          <div style={{marginTop:14,padding:"14px 16px",borderRadius:14,
            background:"rgba(255,255,255,.72)",border:`1px solid ${C.line}`}}>
            <div className="serif" style={{fontSize:10,letterSpacing:".24em",color:C.gold,marginBottom:8}}>〈 合言葉 〉</div>
            <p className="serif" style={{margin:0,fontSize:15,lineHeight:1.95,color:C.lav}}>
              鏡よ鏡、鏡さん。<br/>私が世界で一番美肌になるには、どうしたらええのん？
            </p>
          </div>
        </div>

        {/* 開いた扉（もう開いてる・目の前にある） */}
        <div style={{width:"100%",borderRadius:20,marginTop:18,border:`1px solid ${C.line}`,
          background:"linear-gradient(135deg,#FBF3E4,#F5EAF3,#FBF0EC)",padding:8,
          boxShadow:"0 8px 26px rgba(184,127,192,.14)"}}>
          <img src={DOOR} alt="開いた扉" style={{width:"100%",display:"block",borderRadius:13}}/>
        </div>

        <button onClick={begin} className="serif" style={{width:"100%",marginTop:18,padding:"16px 0",border:"none",
          borderRadius:999,background:"linear-gradient(135deg,#D8BE86,#E0C9E4)",color:"#4A3D53",fontSize:16,
          letterSpacing:".14em",cursor:"pointer",boxShadow:"0 8px 26px rgba(184,127,192,.28)"}}>
          開いた扉、進んじゃう？ 🚪✨
        </button>
        <div style={{marginTop:14,fontSize:11.5,color:C.inkSoft,opacity:.9,lineHeight:1.8}}>
          🌙 しっかり鏡と向き合って、お肌を観察してね
        </div>
      </div></div>);
  }

  // QUIZ
  if(screen==="quiz"){
    const frac=i/Q.length;
    const rm=Math.floor(i/7);
    const M=MIRRORS[rm]||MIRRORS[7];
    const atStart=(i%7===0);
    const f=atStart?roomFairyNode(rm):null;
    return (<div style={{...bg,background:`linear-gradient(180deg,#FBFAF6 0%, ${M.tint} 60%, #FAF6F0 100%)`,transition:"background .6s"}}><Ambient/>
      <div style={{position:"relative",zIndex:1,maxWidth:470,margin:"0 auto"}}>
        <div style={{marginBottom:14}}><Meguri frac={frac}/></div>
        {/* 8つの鏡インジケータ（名前は伏せる・色だけ） */}
        <div style={{display:"flex",justifyContent:"center",alignItems:"center",gap:7,marginBottom:14}}>
          {MIRRORS.map((mm,idx)=>(
            <div key={idx} style={{width:idx===rm?12:7,height:idx===rm?12:7,borderRadius:"50%",
              background:idx<rm?"rgba(184,146,88,.4)":(idx===rm?mm.a:"rgba(184,146,88,.18)"),
              transition:"all .3s",boxShadow:idx===rm?`0 0 9px ${mm.a}`:"none"}}/>
          ))}
        </div>
        {atStart && f && <Fairy key={"fairy"+i} node={f.node} ftype={f.ftype} side={f.side}/>}
        {/* この鏡の間（部屋の写真）＝まるごと・金縁 */}
        <div style={{width:"100%",borderRadius:16,marginBottom:14,
          border:`1px solid ${M.a}55`,background:`linear-gradient(135deg, ${M.tint}, #FFFFFF 60%, ${M.a}22)`,
          padding:7,boxShadow:`0 6px 20px ${M.a}1f`}}>
          <img src={ROOMS[rm]||ROOMS[0]} alt="鏡の間" style={{width:"100%",display:"block",borderRadius:11}}/>
        </div>
        <div key={i} className="fu" style={{...card,textAlign:"center",minHeight:130,display:"flex",flexDirection:"column",justifyContent:"center",
          border:`1px solid ${M.a}55`,boxShadow:`0 10px 32px ${M.a}22`}}>
          <div className="serif" style={{fontSize:11,letterSpacing:".2em",color:M.a,marginBottom:14}}>◈ この鏡をのぞくと……</div>
          <p className="serif" style={{fontSize:18,lineHeight:1.9,margin:"0 0 4px",letterSpacing:".02em"}}>{Q[i][0]}</p>
        </div>
        <div style={{display:"flex",gap:12,marginTop:18}}>
          <button onClick={()=>answer(false)} className="serif" style={{flex:1,padding:"15px 0",borderRadius:999,
            border:`1px solid ${C.line}`,background:"transparent",color:C.ink,fontSize:15,letterSpacing:".1em",cursor:"pointer"}}>そうでもない</button>
          <button onClick={()=>answer(true)} className="serif" style={{flex:1,padding:"15px 0",borderRadius:999,border:"none",
            background:`linear-gradient(135deg,#D8BE86,${M.a})`,color:"#fff",fontSize:15,letterSpacing:".1em",cursor:"pointer",
            boxShadow:`0 6px 18px ${M.a}44`}}>あるかも ♡</button>
        </div>
        <div style={{textAlign:"center",marginTop:14,fontSize:11.5,color:C.inkSoft,opacity:.85,lineHeight:1.8}}>
          🌙 鏡をよく見て、正直に答えてね
        </div>
        <div style={{textAlign:"center",marginTop:8,fontSize:11,color:C.inkSoft,opacity:.7}}>{i+1} / {Q.length}</div>
      </div></div>);
  }

  // REVEAL（鏡がふっと光って、動物が浮かび上がる）
  if(screen==="reveal"){
    const r=R[winner];
    return (<div style={bg}><Ambient/>
      <div style={{position:"relative",zIndex:1,maxWidth:470,margin:"0 auto",textAlign:"center",paddingTop:20}}>
        <div style={{marginBottom:22}}><Meguri frac={1}/></div>
        <div className="serif" style={{fontSize:13,letterSpacing:".26em",color:C.gold,marginBottom:24}}>鏡が、ふっと光って——</div>
        <OrnateMirror typeKey={winner} w={270} delayed={true}/>
        <p className="serif" style={{fontSize:16,lineHeight:1.9,color:C.ink,margin:"34px 0 22px"}}>
          鏡が映した、あなたの肌は——
        </p>
        <button onClick={()=>setScreen("result")} className="serif" style={{padding:"14px 34px",borderRadius:999,border:"none",
          background:"linear-gradient(135deg,#D8BE86,#E0C9E4)",color:"#4A3D53",fontSize:15,letterSpacing:".14em",cursor:"pointer",
          boxShadow:"0 8px 24px rgba(184,127,192,.3)"}}>その子に会う ♡</button>
      </div></div>);
  }

  // RESULT
  const r=R[winner];
  return (<div style={bg}><Ambient/>
    <div style={{position:"relative",zIndex:1,maxWidth:470,margin:"0 auto",textAlign:"center"}} className="fu">
      {/* 動物＝豪華な鏡に、作品まるごと */}
      <div style={{marginTop:6, marginBottom:22}}>
        <OrnateMirror typeKey={winner} w={230}/>
      </div>
      {/* なぜ、この動物なのか（見出しなし・文だけ） */}
      <div style={{...card,marginBottom:16,
        background:"linear-gradient(135deg,rgba(216,190,134,.12),rgba(224,201,228,.14))"}}>
        <div style={{fontSize:30,marginBottom:10}}>{r.animal}</div>
        <p className="serif" style={{fontSize:14.5,lineHeight:2.2,margin:0,color:C.ink,whiteSpace:"pre-wrap"}}>{r.why}</p>
      </div>

      <h2 className="serif" style={{fontSize:24,margin:"0 0 8px",color:C.ink,letterSpacing:".04em"}}>{r.name}</h2>
      <p className="serif" style={{fontSize:14.5,lineHeight:1.9,color:C.lav,margin:"0 0 22px"}}>{r.word}</p>

      <div style={{textAlign:"left",marginBottom:8}}>
        <Acc title="⚠️ 特徴・注意点" open0={true}>
          <p style={{fontSize:14,lineHeight:2,margin:0,color:C.ink}}>{ADV[winner].toku}</p>
        </Acc>
        <Acc title="🌿 おすすめケア">
          {ADV[winner].cares.map((c,idx)=>(
            <div key={idx} style={{fontSize:14,lineHeight:1.7,color:C.ink,marginBottom:7}}>✓ {c}</div>
          ))}
        </Acc>
        <Acc title="💊 推奨成分・ケア方法">
          <p style={{fontSize:14,lineHeight:2,margin:0,color:C.ink,whiteSpace:"pre-wrap"}}>{ADV[winner].seibun}</p>
        </Acc>
        <Acc title="💥 ぼたん流ひとこと">
          <p style={{fontSize:14,lineHeight:2,margin:0,color:C.ink}}>{ADV[winner].hitokoto}</p>
        </Acc>
        <Acc title="🧠 脳との関係（双子の話）">
          <p style={{fontSize:14,lineHeight:2,margin:0,color:C.ink,whiteSpace:"pre-wrap"}}>{ADV[winner].nou}</p>
        </Acc>
      </div>

      {/* ぼたんより（丸枠） */}
      <div style={{...card,marginBottom:18,background:"linear-gradient(135deg,rgba(216,190,134,.14),rgba(224,201,228,.16))"}}>
        <div style={{display:"flex",gap:12,alignItems:"center",marginBottom:12}}>
          <img src={BOTAN_ROUND} alt="ぼたん" onError={(e)=>{e.target.style.display='none';}}
            style={{width:60,height:60,borderRadius:"50%",objectFit:"cover",objectPosition:"50% 38%",flexShrink:0,
            border:`2px solid ${C.goldSoft}`}}/>
          <div className="serif" style={{fontSize:13,letterSpacing:".18em",color:C.gold}}>🤍 ぼたんより</div>
        </div>
        <p style={{fontSize:14,lineHeight:2,margin:0,color:C.ink,textAlign:"left"}}>{ADV[winner].botan}</p>
      </div>

      {/* 8タイプ共通のひとこと */}
      <div style={{margin:"6px 0 18px",padding:"20px 18px",borderRadius:18,
        border:`1px solid ${C.line}`,background:"linear-gradient(135deg,rgba(216,190,134,.18),rgba(224,201,228,.16))"}}>
        <div className="serif" style={{fontSize:10,letterSpacing:".26em",color:C.gold,marginBottom:12}}>― 鏡が、最後に映したもの ―</div>
        <p className="serif" style={{fontSize:15,lineHeight:2.1,margin:0,color:C.ink,whiteSpace:"pre-wrap"}}>{CREDO}</p>
      </div>

      {/* 最後の締め */}
      <div style={{...card,textAlign:"center",marginBottom:14,
        background:"linear-gradient(135deg,rgba(216,190,134,.16),rgba(224,201,228,.16))"}}>
        <img src={FAIRY_IMG} alt="AIぼたん" onError={(e)=>{e.target.style.display='none';}}
          style={{width:64,display:"block",margin:"0 auto 10px"}}/>
        <p className="serif" style={{fontSize:14.5,lineHeight:2.1,color:C.ink,margin:0}}>
          ここまで、おつかれさま🌙<br/><br/>
          この診断でわからんことや、<br/>
          <b style={{color:C.lav}}>“わたしの場合はどうなん？”</b>って思ったら——<br/>
          <b style={{color:C.gold}}>ぼたんに、聞いてな</b>💕
        </p>
      </div>

      {/* 締めの一枚（ドン） */}
      <div style={{width:"100%",borderRadius:20,marginBottom:16,border:`1px solid ${C.line}`,
        background:"linear-gradient(135deg,#FBF3E4,#F5EAF3,#FBF0EC)",padding:8,
        boxShadow:"0 10px 30px rgba(184,127,192,.16)"}}>
        <img src={BOTAN_BIG} alt="ぼたん" onError={(e)=>{e.target.style.display='none';}}
          style={{width:"100%",display:"block",borderRadius:13}}/>
      </div>

      <a href={LINE_URL} target="_blank" rel="noopener noreferrer" style={{display:"block",padding:"15px 0",borderRadius:999,background:"#06C755",color:"#fff",
        textDecoration:"none",fontSize:15,fontWeight:700,marginBottom:12,boxShadow:"0 8px 22px rgba(6,199,85,.28)"}}>💚 続きをLINEで受け取る</a>

      {/* 📸 スクショの撮り方 */}
      <ScreenshotGuide/>

      {/* 🔗 シェア（＝簡易版のURLを配る） */}
      <button onClick={share} className="serif" style={{width:"100%",padding:"14px 0",borderRadius:999,border:"none",
        background:"linear-gradient(135deg,#D8BE86,#E0C9E4)",color:"#4A3D53",fontSize:14.5,letterSpacing:".08em",
        cursor:"pointer",marginBottom:10,boxShadow:"0 8px 22px rgba(184,127,192,.26)"}}>
        {copied ? "コピーしたよ ♡ 貼り付けてね" : "🔗 結果をシェアする"}
      </button>

      {/* 友だちに配る用の一言 */}
      <p className="serif" style={{fontSize:11.5,lineHeight:1.9,color:C.inkSoft,margin:"0 0 14px"}}>
        シェアすると、お友だちには<b style={{color:C.gold}}>はじめの鏡</b>が届くよ🌙<br/>
        <span style={{opacity:.8}}>{LITE_URL.replace("https://","")}</span>
      </p>

      <button onClick={begin} className="serif" style={{width:"100%",padding:"13px 0",borderRadius:999,
        border:`1px solid ${C.line}`,background:"transparent",color:C.gold,fontSize:13,letterSpacing:".12em",cursor:"pointer"}}>
        もう一度、鏡をひらく ♡
      </button>
    </div></div>);
}

ReactDOM.render(React.createElement(App), document.getElementById("root"));
</script>
</body>
</html>
