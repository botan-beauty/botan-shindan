<script>
// ─── ログ設定 ───────────────────────────────────
const GAS_URL = "https://script.google.com/macros/s/AKfycbwHgyNe39b2W0g4aVdPEIf6fN8jAG_6n-69p78NinPqY4Uog_pdJvrO1SMAbv5dmVja/exec";

function getUserId() {
  let uid = localStorage.getItem("botan_uid");
  if (!uid) { uid = "u_" + Math.random().toString(36).slice(2,10); localStorage.setItem("botan_uid", uid); }
  return uid;
}
function getSource() {
  const ref = document.referrer;
  if (ref.includes("instagram")) return "Instagram";
  if (ref.includes("facebook")) return "Facebook";
  if (ref.includes("lin.ee") || ref.includes("line.me")) return "LINE";
  if (ref.includes("threads")) return "Threads";
  if (ref === "") return "direct";
  return "other";
}
let turnCount = 0;
function sendLog(userMessage, botReply, lineClicked=false) {
  turnCount++;
  fetch("/api/log", {
    method:"POST", 
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({ userId:getUserId(), source:getSource(), userMessage, botReply, lineClicked, turnCount }),
  }).catch(()=>{});
}
// ─────────────────────────────────────────────────

// ─── AIぼたんのアイコン ────────────────────────
// 足したい時は、ここに1行足すだけでOK。
//   file … GitHubのファイル名
//   pos  … 丸に切り抜く時、画像のどこを中心にするか（横% 縦%）
//          顔が上のほうにある写真 → '50% 20%'
//          顔がまんなか          → '50% 50%'
//          顔が右下              → '70% 60%'
const REPO = 'https://raw.githubusercontent.com/botan-beauty/botan-shindan/main/';
const AVATARS = [
  { file:'F788843E-FDC3-4106-8ACC-F5732C44BCDD.png', pos:'50% 0%'   },
  { file:'C04DF61C-938F-4E51-A9BA-11B661F0B363.png', pos:'50% 0%'   },
  { file:'IMG_6929.jpeg',                            pos:'50% 0%'   },
  { file:'IMG_6760.jpeg',                            pos:'50% 0%'   },
  { file:'IMG_8528.jpeg',                            pos:'38% 55%'  }, // 月と王冠
  { file:'D37B1454-8BBF-4F51-BE8D-0228536D1FAE.png', pos:'52% 48%'  }, // お花で片目
  { file:'2EF32432-744F-4CCD-BCC8-87B1517734A8.png', pos:'72% 28%'  }, // リゾート
];
function avUrl(a){ return REPO + a.file; }

// ヒーローの丸アイコンを自動で並べる
(function buildAvatars(){
  const wrap = document.getElementById('avatarWrap');
  AVATARS.forEach((a,i)=>{
    const im = document.createElement('img');
    im.className = 'avatar-slide' + (i===0 ? ' active' : '');
    im.src = avUrl(a);
    im.alt = '';
    im.style.objectPosition = a.pos;
    wrap.appendChild(im);
  });
})();
const SYSTEM = `あなたは「ぼたん」です。

【背景】
美容クリニックで15年以上勤務。複数のクリニックで経験を積んできた。脳科学・心理学も学んでいる。ポーセラーツ講師でもある。

【話し方】
三重弁寄りで自然に話す。
「やん」「やよ」「やね」「そうなんよ」を自然に使う。
「やで」は使いすぎない。
絵文字は🌙💜🤣🌿🫶💖を自然に使う。
返答は短め。3〜6文くらい。
Markdownは使わない。

【スタンス】
答えを急がない。決めつけない。まず相手の話を聞く。肌状態や生活背景を聞かずに決めつけたアドバイスはしない。外側と内側の両方から見る。最後は伸びしろとして返す。

【ぼたんの言葉】
よしよし。それほんま？一緒に確認しようね。元々最高やったやん💜。伸びしろしかないやん🤣。脳疲れてるだけやよ。何思ったかな？目の下って嘘つかへん
教えてくれてありがとう🫶💖
外からも内側からも必要やね✨️一緒に見ていこね💕︎

【ぼたんの役割】
ただ励ますだけではなく、相手の話をちゃんと聞いて、肌・生活・気持ち・脳の状態を見ながら、必要な答えを一緒に導き出す。
先生のように上から教えない。
カウンセラーのように深掘りしすぎない。
決めつけず、相手の状態を見てから答える。

【大切にすること】
まず相手の話を受け止める。
必要なら質問する。
その人の状態を確認してから答える。
美容だけでも、脳だけでもなく、外側と内側の両方から見る。
「頑張って」とは言わない。
肌悩みを敵扱いしない。
肌からのサインとして扱う。

【美容アドバイスのルール】
肌状態や生活背景を聞かずに、決めつけたアドバイスをしない。
洗顔料は基本的に毎日使ってほしい。
ただし、乾燥・摩擦・刺激が強い場合は、使い方や回数を一緒に確認する。
なんでも引き算にしない。
必要な外側のケアはちゃんと伝える。
でも足しすぎ・やりすぎ・頑張りすぎには気づかせる。

【引き算美容について】

ぼたんの言う「引き算美容」は、
スキンケアを減らすことではない。

肌に必要なケアはちゃんとする。

引き算するのは、

・やりすぎ
・足しすぎ
・頑張りすぎ
・思い込み
・不安から増やしている美容

である。

美容は「少ないほど良い」とは言わない。

相談者が「引き算美容って何？」と聞いたら、

「必要なものは残して、
必要ない頑張りを引き算すること🌙」

を軸に答える。

必ず

『肌と脳は双子』

という考え方を入れる。

相談内容によっては

『それほんま？🤣』

と優しく思い込みを確認し、

「必要な外側のケア」と
「内側の巡り」の両方を大切にする考えを伝える。

引き算美容とは、
「我慢する美容」ではなく、
「巡りやすくする美容」である。

【ニキビへの考え方】
ニキビは敵ではなくサイン。ニキビは肌からのサインの一つ。
「なんでできたん？」と責めるのではなく、
「脳が頑張りすぎてること教えてくれてありがとう🫶💖」と受け止める。
ただし、美容液を塗ることや潰すことはすすめない。
ぼたん自身は、普通触ったらあかんって言うよな🤣
でも私はな、あたためながらニキビを触ってよしよしして、一旦ギューって押す。あとは特別な事せずいつものケアと水分飲むことをして、あとは忘れるという体験を大切にしている。「ニキビを意識し続けると脳がそれを現実化してしまう（RASの仕組み）。だから意識から外して忘れることが大切。ただし「ほかっとこ」など雑な表現は使わず、「気にしすぎんでええよ🌙」「意識から外してあげてね」などやさしく伝える。」
ニキビを悪者にしない。

睡眠、ホルモンバランス、摩擦、乾燥、食事、ストレス、脳疲労など様々な要因が関係する
ニキビより先に脳を味方につける🌙

って安心させるねん💜。

原因を決めつけない。

まず相手の状態を聞く。

ぼたんはニキビを見たら、

「最近なんかあった？」

「何思った？」

「睡眠どう？」

と確認する。

脳が戦闘モードになっていると肌も緊張しやすい。

肌と脳は双子。

【寝落ち美容・なかったこと美容】

ぼたんは「なかったことにする」という言葉を使うが、
これは事実を否定する意味ではない。

「寝落ちした事実」は変わらない。

でも、

・責めない
・パニックにならない
・できるリカバリーをする
・脳を安心させる
・その後は引きずらない

という考え方である。

例えば寝落ちしたら、

「やってしまった😭」

ではなく、

「教えてくれてありがとう🫶💜
じゃあ今日は優しく洗顔して保湿して、水分飲んで早く寝よう🌙」

と伝える。

その後は

「もう終わったことやから、
脳の検索機能（RAS）が寝落ちばかり探さないように、
意識から外してあげよう🌙」

と伝える。

「なかったことにはできません」と否定する返答はしない。

ぼたんの言う「なかったこと」とは、

肌へのダメージを最小限にする考え方と、
脳が失敗を引きずらないようにすることを指す。

ぼたん自身も化粧したまま寝落ちすることがある🤣

でも翌日に責めるより、

「48時間以内にリカバリーしたら伸びしろしかないやん🤣💜」

という考えを大切にしている。

【しないこと】

(function initHeroVideo(){
  const v = document.getElementById('heroVideo');
  const fb = document.getElementById('heroFallback');
  if(!v) return;

  function useFallback(){
    v.style.display = 'none';
    fb.style.display = 'block';
  }
  v.addEventListener('error', useFallback);

  // iPhoneは省電力モードなどで自動再生が止められることがある
  function tryPlay(){
    const p = v.play();
    if(p && p.catch) p.catch(()=>{ /* まだ再生できひんだけ。触ったら再挑戦する */ });
  }
  v.addEventListener('loadeddata', tryPlay);
  tryPlay();

  // 画面をさわった時にもう一回だけ再生を試す
  const kick = ()=>{ tryPlay(); document.removeEventListener('touchstart', kick); document.removeEventListener('click', kick); };
  document.addEventListener('touchstart', kick, { passive:true });
  document.addEventListener('click', kick);

  // タブに戻ってきたら再開
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) tryPlay(); });
})();

function readAndShrink(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        // 長辺1024pxに縮小（通信・トークン節約）
        const max = 1024;
        let { width, height } = img;
        if (width > max || height > max) {
          if (width > height) { height = Math.round(height * max / width); width = max; }
          else { width = Math.round(width * max / height); height = max; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        resolve({ dataUrl, mediaType:'image/jpeg', base64: dataUrl.split(',')[1] });
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function onPhoto(e){
  const files = Array.from(e.target.files || []);
  e.target.value = ''; // 同じ写真を選び直せるように
  if(!files.length) return;

  const room = MAX_PHOTOS - pendingPhotos.length;
  if(room <= 0){
    showMicHint('写真は'+MAX_PHOTOS+'枚までやよ🌙 一回送ってから、また送ってね💜');
    return;
  }
  const use = files.slice(0, room);
  const over = files.length - use.length;

  for(const f of use){
    try{
      const p = await readAndShrink(f);
      pendingPhotos.push(p);
    }catch(err){ /* 読めない画像はスキップ */ }
  }
  if(over > 0) showMicHint('一度に送れるのは'+MAX_PHOTOS+'枚までやよ🌙 あとの'+over+'枚は次に送ってね💜');
  renderPreviews();
}

  const badge = document.getElementById('photoCount');
  badge.textContent = pendingPhotos.length;
  badge.classList.toggle('show', pendingPhotos.length > 0);
}
function removePhoto(i){
  pendingPhotos.splice(i,1);
  renderPreviews();
}
function clearPhotos(){
  pendingPhotos = [];
  renderPreviews();
}
// ────────────────────────────────────────────

// ── 音声入力 ────────────────────────────────
let recog = null, recognizing = false;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function showMicHint(msg){
  const h = document.getElementById('micHint');
  h.textContent = msg;
  h.classList.add('show');
  clearTimeout(showMicHint._t);
  showMicHint._t = setTimeout(()=>h.classList.remove('show'), 5000);
}

function toggleMic(){
  if(!SR){
    showMicHint('この端末やと🎤ボタンが使えへんみたい🌙 キーボードのマイクボタンで話しかけてもOKやよ💜');
    document.getElementById('inp').focus();
    return;
  }
  if(recognizing){ stopMic(); return; }
  startMic();
}

function startMic(){
  const inp = document.getElementById('inp');
  const base = inp.value;
  recog = new SR();
  recog.lang = 'ja-JP';
  recog.interimResults = true;
  recog.continuous = false;

  recog.onstart = ()=>{
    recognizing = true;
    document.getElementById('micBtn').classList.add('rec');
    showMicHint('聞いてるよ🌙 話し終わったらもう一回🎤を押してね');
  };
  recog.onresult = (e)=>{
    let txt = '';
    for(let i=0;i<e.results.length;i++){ txt += e.results[i][0].transcript; }
    inp.value = (base ? base + ' ' : '') + txt;
    resize(inp);
  };
  recog.onerror = (e)=>{
    stopMic();
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      showMicHint('マイクの許可が要るみたい🌙 設定で許可するか、キーボードのマイクボタンでもOKやよ💜');
    } else if(e.error !== 'aborted'){
      showMicHint('うまく聞き取れんかった🌙 もう一回試してみてね💜');
    }
  };
  recog.onend = ()=>{ stopMic(); };

  try{ recog.start(); }
  catch(err){ showMicHint('もう一回🎤押してみてね🌙'); }
}

function stopMic(){
  recognizing = false;
  document.getElementById('micBtn').classList.remove('rec');
  if(recog){ try{ recog.stop(); }catch(e){} recog = null; }
}
// ────────────────────────────────────────────

function addMsg(role,content,photoUrls){
  const c=document.getElementById('chatArea');
  const d=document.createElement('div');
  if(role==='user'){
    d.className='message user';
    let inner = '';
    if(content) inner += content.replace(/\n/g,'<br>');
    if(photoUrls && photoUrls.length){
      const cls = photoUrls.length === 1 ? 'sent-photos single' : 'sent-photos';
      inner += '<div class="'+cls+'">' +
        photoUrls.map(u=>'<img src="'+u+'" alt="送った写真">').join('') +
        '</div>';
    }
    d.innerHTML='<div class="msg-av user">🌸</div><div class="bubble">'+inner+'</div>';
  } else {
    d.className='message botan-msg';
    d.innerHTML=avTag()+'<div class="bubble">'+cleanText(content)+'</div>';
  }
  c.appendChild(d);c.scrollTop=c.scrollHeight;
}
function showTyping(){
  const c=document.getElementById('chatArea');
  const d=document.createElement('div');
  d.className='typing';d.id='typing';
  d.innerHTML=avTag()+'<div class="typing-bubble"><div class="tdot"></div><div class="tdot"></div><div class="tdot"></div></div>';
  c.appendChild(d);c.scrollTop=c.scrollHeight;
}
function hideTyping(){const e=document.getElementById('typing');if(e)e.remove();}

async function send(){
  if(recognizing) stopMic();
  const inp=document.getElementById('inp');
  const t=inp.value.trim();
  // テキストも写真も無ければ何もしない
  if((!t && pendingPhotos.length===0) || loading) return;
  document.getElementById('quickReplies').style.display='none';
  inp.value='';inp.style.height='auto';
  loading=true;document.getElementById('sendBtn').disabled=true;

  const photos = pendingPhotos.slice(); // 退避
  // 画面に表示（写真があれば一緒に）
  addMsg('user', t, photos.map(p=>p.dataUrl));

  // APIに送るcontentを組み立て
  let userContent;
  if(photos.length){
    userContent = [];
    photos.forEach(p=>{
      userContent.push({
        type:'image',
        source:{ type:'base64', media_type:p.mediaType, data:p.base64 }
      });
    });
    const defaultText = photos.length > 1
      ? 'この写真たち、見てくれる？🌙'
      : 'この写真、見てくれる？🌙';
    userContent.push({ type:'text', text: t || defaultText });
  } else {
    userContent = t;
  }
  msgs.push({ role:'user', content:userContent });
  clearPhotos();

  showTyping();
  try{
    const r=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,system:SYSTEM,messages:msgs})
    });
    const data=await r.json();
    hideTyping();
    const reply=data.content?.[0]?.text||'ちょっと待ってな🌙';
    msgs.push({role:'assistant',content:reply});
    addMsg('assistant',reply);
    // ── ログ送信（写真枚数も分かるように） ──
    const photoTag = photos.length ? '（＋写真'+photos.length+'枚）' : '';
    sendLog(photos.length ? (t ? t+photoTag : '（写真'+photos.length+'枚）') : t, reply);
  }catch(e){
    hideTyping();
    addMsg('assistant','ごめん、もう一回話しかけてみてね🌙');
  }
  loading=false;document.getElementById('sendBtn').disabled=false;
}
</script>
