<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --blush:#f2cfc7; --rose:#d4837a; --lavender:#c9b8d8;
  --cream:#fdf8f5; --warm:#e8ddd5; --dark:#3d2b2b; --light:#f9f2ee;
}
body { font-family:'Zen Kaku Gothic New',sans-serif; background:var(--cream); color:var(--dark); height:100dvh; display:flex; flex-direction:column; overflow:hidden; }
.hero { position:relative; height:190px; overflow:hidden; flex-shrink:0; }
.hero-img { width:100%; height:100%; object-fit:cover; object-position:center 25%; }
.hero-overlay { position:absolute; inset:0; background:linear-gradient(to bottom,rgba(61,43,43,0.05),rgba(61,43,43,0.55)); }
.hero-content { position:absolute; bottom:0; left:0; right:0; padding:14px 18px; display:flex; align-items:flex-end; gap:13px; }
.avatar-wrap { position:relative; width:68px; height:68px; border-radius:50%; overflow:hidden; border:3px solid white; box-shadow:0 4px 16px rgba(0,0,0,0.25); flex-shrink:0; }
.avatar-slide { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center top; opacity:0; transition:opacity 1s ease; }
.avatar-slide.active { opacity:1; }
/* ── 会話の背景の動き（キラキラ雫＋ふよふよぼたん） ── */
.chat-fx { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
.hero { z-index:3; }
.chat-area { position:relative; z-index:1; }
.quick-replies, .preview-bar, .mic-hint, .input-area { position:relative; z-index:3; }
.message, .typing { position:relative; z-index:1; }
.sparkle { position:absolute; border-radius:50%; opacity:0; will-change:transform,opacity;
  background:radial-gradient(circle at 32% 30%, rgba(255,255,255,0.95), rgba(212,131,122,0.55) 38%, rgba(201,184,216,0) 74%);
  box-shadow:0 0 7px rgba(201,184,216,0.7); }
@keyframes floatUp {
  0%   { transform:translate3d(0,20px,0) scale(0.5); opacity:0; }
  18%  { opacity:0.85; }
  70%  { opacity:0.6; }
  100% { transform:translate3d(var(--dx,0px),-230px,0) scale(1.05); opacity:0; }
}
.drop { position:absolute; opacity:0; will-change:transform,opacity;
  width:8px; height:12px; border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:linear-gradient(to bottom, rgba(255,255,255,0.9), rgba(201,184,216,0.75));
  box-shadow:0 0 6px rgba(201,184,216,0.6); }
@keyframes dropFall {
  0%   { transform:translate3d(0,-20px,0) scale(0.7); opacity:0; }
  20%  { opacity:0.75; }
  100% { transform:translate3d(var(--dx,0px),260px,0) scale(1); opacity:0; }
}
.message.user.with-fairy .bubble { max-width:62%; }
.msg-fairy { width:46px; flex-shrink:0; align-self:flex-end; margin-bottom:2px;
  opacity:0; animation:fairyPop 0.9s ease forwards;
  filter:drop-shadow(0 2px 7px rgba(150,120,170,0.3)); }
.msg-fairy img { display:block; width:100%; animation:fuyo 3s ease-in-out infinite; }
@keyframes fairyPop { 0%{ opacity:0; transform:translateY(6px) scale(0.8);} 100%{ opacity:0.95; transform:translateY(0) scale(1);} }
@keyframes fuyo { 0%,100%{ transform:translateY(0) rotate(-3deg);} 50%{ transform:translateY(-6px) rotate(3deg);} }
.hero-text h1 { font-family:'Shippori Mincho',serif; font-size:19px; font-weight:700; color:white; text-shadow:0 1px 6px rgba(0,0,0,0.4); }
.hero-text p { font-size:11px; color:rgba(255,255,255,0.88); display:flex; align-items:center; gap:5px; margin-top:3px; }

@keyframes pulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:0.6;transform:scale(1.3);} }
.chat-area { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:13px; }
.chat-area::-webkit-scrollbar { width:0; }

.msg-av { width:34px; height:34px; border-radius:50%; overflow:hidden; flex-shrink:0; align-self:flex-end; border:2px solid white; box-shadow:0 2px 8px rgba(0,0,0,0.12); }

textarea::placeholder { color:#b8a8a8; }
.photo-btn, .mic-btn { width:41px; height:41px; border-radius:50%; background:var(--light); border:1.5px solid var(--warm); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; position:relative; }
.mic-btn.rec { background:linear-gradient(135deg,#d4837a,#c97070); border-color:#c97070; animation:micPulse 1.2s ease-in-out infinite; }
@keyframes micPulse { 0%,100%{box-shadow:0 0 0 0 rgba(212,131,122,0.55);} 50%{box-shadow:0 0 0 9px rgba(212,131,122,0);} }
.photo-count { position:absolute; top:-4px; right:-4px; background:var(--rose); color:white; font-size:10px; min-width:17px; height:17px; border-radius:9px; display:none; align-items:center; justify-content:center; padding:0 4px; }
.photo-count.show { display:flex; }
.send-btn { width:43px; height:43px; border-radius:50%; background:linear-gradient(135deg,#d4837a,#c97070); border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:17px; color:white; box-shadow:0 3px 12px rgba(212,131,122,0.4); flex-shrink:0; }
.send-btn:disabled { opacity:0.5; cursor:not-allowed; }
.preview-bar { padding:0 14px 8px; display:none; }
.preview-bar.show { display:block; }
.preview-head { font-size:11px; color:#8a7a7a; margin-bottom:6px; display:flex; align-items:center; gap:8px; }
.preview-head .clear-all { background:none; border:none; color:var(--rose); font-size:11px; text-decoration:underline; cursor:pointer; font-family:inherit; padding:0; }
.preview-list { display:flex; gap:7px; flex-wrap:wrap; }
.preview-chip { position:relative; }
.preview-chip img { width:56px; height:56px; border-radius:10px; object-fit:cover; border:1.5px solid var(--warm); display:block; }
.preview-chip .rm { position:absolute; top:-5px; right:-5px; background:var(--rose); color:white; border:none; border-radius:50%; width:20px; height:20px; font-size:12px; cursor:pointer; line-height:1; padding:0; }
.mic-hint { padding:0 14px 8px; font-size:11px; color:#a89898; display:none; }
.mic-hint.show { display:block; }
.typing { display:flex; gap:9px; align-items:flex-end; }
.typing-bubble { background:white; border-radius:18px; border-bottom-left-radius:5px; padding:13px 17px; box-shadow:0 2px 10px rgba(61,43,43,0.08); display:flex; gap:5px; align-items:center; }
.tdot { width:7px; height:7px; background:var(--blush); border-radius:50%; animation:bounce 1.2s ease-in-out infinite; }
.tdot:nth-child(2){animation-delay:0.2s;} .tdot:nth-child(3){animation-delay:0.4s;}
@keyframes bounce { 0%,60%,100%{transform:translateY(0);} 30%{transform:translateY(-6px);} }
</style>

<script>
// ─── ログ設定 ───────────────────────────────────
const GAS_URL = "https://script.google.com/macros/s/AKfycbwHgyNe39b2W0g4aVdPEIf6fN8jAG_6n-69p78NinPqY4Uog_pdJvrO1SMAbv5dmVja/exec";

function getUserId() {
  let uid = localStorage.getItem("botan_uid");
  if (!uid) { uid = "u_" + Math.random().toString(36).slice(2,10); localStorage.setItem("botan_uid", uid); }
  return uid;
}
function getSource() {
  const ref = document.referrer;
  if (ref.includes("instagram")) return "Instagram";
  if (ref.includes("facebook")) return "Facebook";
  if (ref.includes("lin.ee") || ref.includes("line.me")) return "LINE";
  if (ref.includes("threads")) return "Threads";
  if (ref === "") return "direct";
  return "other";
}
let turnCount = 0;
function sendLog(userMessage, botReply, lineClicked=false) {
  turnCount++;
  fetch("/api/log", {
    method:"POST", 
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({ userId:getUserId(), source:getSource(), userMessage, botReply, lineClicked, turnCount }),
  }).catch(()=>{});
}
// ─────────────────────────────────────────────────

// ─── AIぼたんのアイコン ────────────────────────
// 足したい時は、ここに1行足すだけでOK。
//   file … GitHubのファイル名
//   pos  … 丸に切り抜く時、画像のどこを中心にするか（横% 縦%）
//          顔が上のほうにある写真 → '50% 20%'
//          顔がまんなか          → '50% 50%'
//          顔が右下              → '70% 60%'
const REPO = 'https://raw.githubusercontent.com/botan-beauty/botan-shindan/main/';
const AVATARS = [
  { file:'F788843E-FDC3-4106-8ACC-F5732C44BCDD.png', pos:'50% 0%'   },
  { file:'C04DF61C-938F-4E51-A9BA-11B661F0B363.png', pos:'50% 0%'   },
  { file:'IMG_6929.jpeg',                            pos:'50% 0%'   },
  { file:'IMG_6760.jpeg',                            pos:'50% 0%'   },
  { file:'IMG_8528.jpeg',                            pos:'38% 55%'  }, // 月と王冠
  { file:'D37B1454-8BBF-4F51-BE8D-0228536D1FAE.png', pos:'52% 48%'  }, // お花で片目
  { file:'2EF32432-744F-4CCD-BCC8-87B1517734A8.png', pos:'72% 28%'  }, // リゾート
];
function avUrl(a){ return REPO + a.file; }

// ヒーローの丸アイコンを自動で並べる
(function buildAvatars(){
  const wrap = document.getElementById('avatarWrap');
  AVATARS.forEach((a,i)=>{
    const im = document.createElement('img');
    im.className = 'avatar-slide' + (i===0 ? ' active' : '');
    im.src = avUrl(a);
    im.alt = '';
    im.style.objectPosition = a.pos;
    wrap.appendChild(im);
  });
})();
// ぼたんの人格（システムプロンプト）はサーバー側（functions/api/chat.js）に置いてある＝ここからは見えない

let msgs=[], cur=0, loading=false;

// ═══════════════════════════════════════════════════
//  ★夏祭りのまとめ（matome）から持ち込まれた診断結果を受け取る
//  matome側は  ?botan_shimi=...&botan_rikimi=...&botan_honto=...&botan_zoku=...
//  という形でURLに結果を乗せて渡してくる。それをここで読み取る。
// ═══════════════════════════════════════════════════
const SHINDAN_LABELS = {
  botan_shimi:  '鏡の館（肌タイプ）',
  botan_rikimi: '力みチェック',
  botan_honto:  'それ、ほんとなん？',
  botan_zoku:   'マインドブレイン（脳タイプ）'
};
function readShindanFromURL(){
  try{
    const p = new URLSearchParams(location.search);
    const found = [];
    Object.keys(SHINDAN_LABELS).forEach(k=>{
      const v = p.get(k);
      if(v) found.push({ key:k, label:SHINDAN_LABELS[k], value:v });
    });
    return found;
  }catch(e){ return []; }
}
const carriedShindan = readShindanFromURL();

// 前に一度でも診断を持ち込んだことがあるか（＝2回目以降の判定に使う）
const CARRIED_KEY = 'botan_carried_once';
function hasCarriedBefore(){
  try{ return localStorage.getItem(CARRIED_KEY) === '1'; }catch(e){ return false; }
}
function markCarried(){
  try{ localStorage.setItem(CARRIED_KEY, '1'); }catch(e){}
}

// 診断結果を、ぼたんに渡す下地メッセージを1本作る（画面には出さない）
// ※どう気づきを渡すかは chat.js の人格に任せる。ここは結果を伝えるだけ。
function buildShindanSeed(isRepeat){
  const lines = carriedShindan.map(s => '・' + s.label + '：' + s.value).join('\n');
  const head = isRepeat
    ? '（また夏祭りの診断を持ってきました。今回の結果です）'
    : '（夏祭りをぜんぶ回って、診断結果を持ってきました。わたしの結果です）';
  return head + '\n' + lines;
}

// 起動時に、AIぼたん本人（chat.js）に結果を渡して、最初のひとことを喋ってもらう
async function greetWithShindan(isRepeat){
  const seedText = buildShindanSeed(isRepeat);
  // 下地メッセージ（画面には出さない・保存もしない）
  msgs.push({ role:'user', hidden:true, content: seedText });

  showTyping();
  try{
    const r = await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:1000, memoryNote:memoryNote, messages:msgs })
    });
    const data = await r.json();
    hideTyping();
    const reply = data.content?.[0]?.text || 'よう来たね🌙 ちょっと待ってな💜';
    msgs.push({ role:'assistant', content: reply });
    addMsg('assistant', reply);
    saveMemory();
  }catch(e){
    hideTyping();
    // 通信が失敗しても、結果だけは出しておく（最低限）
    const resultLines = carriedShindan.map(s => '🔸 ' + s.label + '：' + s.value).join('\n');
    addMsg('assistant', 'よう来たね🌙 夏祭り回ってきてくれてありがとう💜\n\n' + resultLines + '\n\nもう一回話しかけてくれる？🌙');
  }
}
// ═══════════════════════════════════════════════════

let pendingPhotos=[]; // [{ dataUrl, mediaType, base64 }]
const MAX_PHOTOS = 5;

// ── トップ動画（自動再生・失敗したら写真に戻す） ──────────
(function initHeroVideo(){
  const v = document.getElementById('heroVideo');
  const fb = document.getElementById('heroFallback');
  if(!v) return;

  function useFallback(){
    v.style.display = 'none';
    fb.style.display = 'block';
  }
  v.addEventListener('error', useFallback);

  // iPhoneは省電力モードなどで自動再生が止められることがある
  function tryPlay(){
    const p = v.play();
    if(p && p.catch) p.catch(()=>{ /* まだ再生できひんだけ。触ったら再挑戦する */ });
  }
  v.addEventListener('loadeddata', tryPlay);
  tryPlay();

  // 画面をさわった時にもう一回だけ再生を試す
  const kick = ()=>{ tryPlay(); document.removeEventListener('touchstart', kick); document.removeEventListener('click', kick); };
  document.addEventListener('touchstart', kick, { passive:true });
  document.addEventListener('click', kick);

  // タブに戻ってきたら再開
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) tryPlay(); });
})();

const slides=document.querySelectorAll('.avatar-slide');
setInterval(()=>{slides[cur].classList.remove('active');cur=(cur+1)%slides.length;slides[cur].classList.add('active');},3000);

// ── 会話の背景の動き（キラキラ雫）＋ 話を聞いてる小さい妖精 ──────
const FAIRY_CANDIDATES = [
  'https://raw.githubusercontent.com/botan-beauty/botan-shindan/main/fairy.png',
  'https://raw.githubusercontent.com/botan-beauty/botan-shindan/main/fairy-pray.png',
  'https://raw.githubusercontent.com/botan-beauty/botan-shindan/main/fairy-point.png',
  'https://raw.githubusercontent.com/botan-beauty/botan-shindan/main/fairy-funn.png',
  'https://raw.githubusercontent.com/botan-beauty/botan-shindan/main/IMG_9783.png',
];

const fxLayer = document.getElementById('chatFx');
let lastFairySrc = null;      // 直前に出したやつ（続けて同じのが出えへんように）
let lastFairyTurn = -99;      // 前に出た回を覚えとく

// ランダムに1枚（直前と同じのは避ける）
function pickFairy(){
  if(FAIRY_CANDIDATES.length === 1) return FAIRY_CANDIDATES[0];
  let pick;
  do { pick = FAIRY_CANDIDATES[Math.floor(Math.random()*FAIRY_CANDIDATES.length)]; }
  while(pick === lastFairySrc);
  lastFairySrc = pick;
  return pick;
}

// 会話エリアの上下の位置（キラキラをそこだけに出すため）
function chatBounds(){
  const el = document.getElementById('chatArea');
  const r = el.getBoundingClientRect();
  return { top:r.top, bottom:r.bottom, height:r.height };

// URLを押しやすいボタンカードに変換（既知の診断URLのみ・確実な方式）
function linkify(html){
  const map = [
    ['https://botan-beauty.github.io/botan-shindan/true_mirror.html', '🔮 鏡の館（シミ診断）はこちら'],

// ── 写真まわり（複数枚対応・最大5枚） ──────────────
function readAndShrink(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        // 長辺1024pxに縮小（通信・トークン節約）
        const max = 1024;
        let { width, height } = img;
        if (width > max || height > max) {
          if (width > height) { height = Math.round(height * max / width); width = max; }
          else { width = Math.round(width * max / height); height = max; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        resolve({ dataUrl, mediaType:'image/jpeg', base64: dataUrl.split(',')[1] });
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function onPhoto(e){
  const files = Array.from(e.target.files || []);
  e.target.value = ''; // 同じ写真を選び直せるように
  if(!files.length) return;

  const room = MAX_PHOTOS - pendingPhotos.length;
  if(room <= 0){
    showMicHint('写真は'+MAX_PHOTOS+'枚までやよ🌙 一回送ってから、また送ってね💜');
    return;
  }
  const use = files.slice(0, room);
  const over = files.length - use.length;

  for(const f of use){
    try{
      const p = await readAndShrink(f);
      pendingPhotos.push(p);
    }catch(err){ /* 読めない画像はスキップ */ }
  }
  if(over > 0) showMicHint('一度に送れるのは'+MAX_PHOTOS+'枚までやよ🌙 あとの'+over+'枚は次に送ってね💜');
  renderPreviews();
}

}

// ── 音声入力 ────────────────────────────────
let recog = null, recognizing = false;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function showMicHint(msg){
  const h = document.getElementById('micHint');
  h.textContent = msg;
  h.classList.add('show');
  clearTimeout(showMicHint._t);
  showMicHint._t = setTimeout(()=>h.classList.remove('show'), 5000);
}

function toggleMic(){
  if(!SR){
    showMicHint('この端末やと🎤ボタンが使えへんみたい🌙 キーボードのマイクボタンで話しかけてもOKやよ💜');
    document.getElementById('inp').focus();
    return;
  }
  if(recognizing){ stopMic(); return; }
  startMic();
}

function startMic(){
  const inp = document.getElementById('inp');
  const base = inp.value;
  recog = new SR();
  recog.lang = 'ja-JP';
  recog.interimResults = true;
  recog.continuous = false;

  recog.onstart = ()=>{
    recognizing = true;
    document.getElementById('micBtn').classList.add('rec');
    showMicHint('聞いてるよ🌙 話し終わったらもう一回🎤を押してね');
  };
  recog.onresult = (e)=>{
    let txt = '';
    for(let i=0;i<e.results.length;i++){ txt += e.results[i][0].transcript; }
    inp.value = (base ? base + ' ' : '') + txt;
    resize(inp);
  };
  recog.onerror = (e)=>{
    stopMic();
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      showMicHint('マイクの許可が要るみたい🌙 設定で許可するか、キーボードのマイクボタンでもOKやよ💜');
    } else if(e.error !== 'aborted'){
      showMicHint('うまく聞き取れんかった🌙 もう一回試してみてね💜');
    }
  };
  recog.onend = ()=>{ stopMic(); };

  try{ recog.start(); }
  catch(err){ showMicHint('もう一回🎤押してみてね🌙'); }
}

function stopMic(){
  recognizing = false;
  document.getElementById('micBtn').classList.remove('rec');
  if(recog){ try{ recog.stop(); }catch(e){} recog = null; }
}

// ─── 記憶 ────────────────────────────────────
const MEM_KEY  = 'botan_memory';     // 要点メモ
const HIST_KEY = 'botan_history';    // 直近の会話
const KEEP_TURNS = 6;                // 何往復ぶん覚えとくか
const SUMMARY_EVERY = 5;             // 何往復ごとに要点を作り直すか

let memoryNote = '';                 // 要点メモの中身
let turnsSinceSummary = 0;

function loadMemory(){
  try{
    memoryNote = localStorage.getItem(MEM_KEY) || '';
    const raw = localStorage.getItem(HIST_KEY);
    if(raw){
      const saved = JSON.parse(raw);
      if(Array.isArray(saved)) msgs = saved;
    }
  }catch(e){ memoryNote=''; msgs=[]; }
}

function saveMemory(){
  try{
    // 隠しメッセージ（診断の下地）は保存しない＝画面にも二度と出さない
    const visible = msgs.filter(m => !m.hidden);
    // 直近だけ残す（写真は重いので、保存する時は外す）
    const trimmed = visible.slice(-KEEP_TURNS*2).map(m=>{
      if(typeof m.content === 'string') return { role:m.role, content:m.content };
      // 画像入りは、文字の部分だけ残す
      const texts = (m.content||[]).filter(c=>c.type==='text').map(c=>c.text).join(' ');
      return { role:m.role, content: texts || '（写真）' };
    });
    localStorage.setItem(HIST_KEY, JSON.stringify(trimmed));
    localStorage.setItem(MEM_KEY, memoryNote);
  }catch(e){ /* 保存でけへんくても会話は続く */ }
}

function forgetAll(){
  memoryNote = '';
  msgs = [];
  turnsSinceSummary = 0;
  try{
    localStorage.removeItem(MEM_KEY);
    localStorage.removeItem(HIST_KEY);
    localStorage.removeItem(CARRIED_KEY);   // 「診断を持ってきた印」も消す＝初回に戻る
  }catch(e){}
}

// 何往復かごとに、要点を作り直す（AIに短くまとめてもらう）
async function updateMemoryNote(){
  const recent = msgs.slice(-10).map(m=>{
    const t = typeof m.content === 'string'
      ? m.content
      : (m.content||[]).filter(c=>c.type==='text').map(c=>c.text).join(' ');
    return (m.role==='user' ? '相談者: ' : 'ぼたん: ') + t;
  }).join('\n');

  const prompt = `次の会話から、次に話す時に覚えておくべきことだけを、短い箇条書きで書き出して。

今のメモ:
${memoryNote || '（まだ無し）'}

最近の会話:
${recent}

ルール:
- 5行以内。1行は20文字くらいまで
- 名前（呼び名）、肌の状態、生活、気持ち、診断結果、大事な出来事だけ
- 一時的な話や雑談は入れない
- 今のメモに足す形で、要らんくなったものは消す
- 箇条書きだけ返す。前置きも説明もいらん`;

  try{
    const r = await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-6', max_tokens:300,
        persona:false,
        messages:[{ role:'user', content:prompt }]
      })
    });
    const data = await r.json();
    const note = data.content?.[0]?.text?.trim();
    if(note && note.length < 400){ memoryNote = note; saveMemory(); }
  }catch(e){ /* 失敗しても会話は続く */ }
}
// ────────────────────────────────────────────

// ═══════════════════════════════════════════════════
//  起動時の分岐
//  軸は「夏祭りのまとめを持ってきたか」。
//  ★大事：まとめを持ってきたら、固定文で終わらせず、
//    AIぼたん本人（chat.js の人格）に結果を渡して喋ってもらう。
//    → 「肌と脳のつながり＝気づき」を、その人だけの言葉で返してくれる。
//
//   A. まとめ持ち込み・初回 … AIぼたんが結果を読んで、双子の気づきを渡す
//   B. まとめ持ち込み・2回目以降 … 同上（人格が"また来たね"を汲んで返す）
//   C. まとめ無し … 初対面＝通常挨拶／続き＝つづきから（今まで通り）
// ═══════════════════════════════════════════════════
(async function restoreConversation(){
  loadMemory();

  const hasHistory = msgs.length > 0;   // AIぼたんと前に話したことがある人か
  const area = document.getElementById('chatArea');
  const qr = document.getElementById('quickReplies');

  // 過去の会話を画面に戻す（共通処理）
  function paintHistory(){
    area.innerHTML = '';
    const note = document.createElement('div');
    note.style.cssText = 'text-align:center;font-size:11px;color:#b8a8a8;padding:4px 0 2px;';
    note.textContent = 'つづきから🌙';
    area.appendChild(note);
    msgs.forEach(m=>{
      if(m.hidden) return;   // 隠しメッセージ（診断の下地）は画面に出さない
      const text = typeof m.content === 'string'
        ? m.content
        : (m.content||[]).filter(c=>c.type==='text').map(c=>c.text).join(' ');
      addMsg(m.role === 'user' ? 'user' : 'assistant', text, null);
    });
  }

  // ── まとめを持ってきた場合 ──────────────────
  if(carriedShindan.length > 0){
    const isRepeat = hasCarriedBefore();   // 前にも診断を持ってきたことがあるか

    // 常連（会話履歴あり）は、過去の会話をまず戻す。新人はHTMLの最初の挨拶をそのまま残す。
    if(hasHistory){
      paintHistory();
    }
    qr.style.display='none';

    // ★AIぼたん本人に、結果を渡して喋ってもらう（固定文にしない）
    await greetWithShindan(isRepeat);

    markCarried();       // 「一度持ってきた」と記録
    return;
  }

  // ── まとめ無し ──────────────────
  // C-1. 続きがある人 → つづきから（今まで通り）
  if(hasHistory){
    paintHistory();
    qr.style.display='none';
    return;
  }
  // C-2. はじめての人・持ち込みなし → HTMLの挨拶のまま（何もしない）
})();

async function send(){
  if(recognizing) stopMic();
  const inp=document.getElementById('inp');
  const t=inp.value.trim();
  // テキストも写真も無ければ何もしない
  if((!t && pendingPhotos.length===0) || loading) return;
  document.getElementById('quickReplies').style.display='none';
  inp.value='';inp.style.height='auto';

  // ── 合言葉「忘」だけ送られたら、記憶をぜんぶ消す ──
  if(t === '忘' && pendingPhotos.length === 0){
    addMsg('user', t, null);
    forgetAll();
    document.getElementById('chatArea').innerHTML = '';
    setTimeout(()=>{
      addMsg('assistant',
        'あれっ　なんやった？忘れちゃったみたい🤣\n\n' +
        'ところで、はじめましてなかわい子ちゃんやん💜\n\n' +
        '私、AIぼたん🌙\n\n' +
        'そや、なんて呼んだらええ？🌙');
    }, 400);
    return;
  }

  loading=true;document.getElementById('sendBtn').disabled=true;

  const photos = pendingPhotos.slice(); // 退避
  // 画面に表示（写真があれば一緒に）
  addMsg('user', t, photos.map(p=>p.dataUrl));

  // APIに送るcontentを組み立て
  let userContent;
  if(photos.length){
    userContent = [];
    photos.forEach(p=>{
      userContent.push({
        type:'image',
        source:{ type:'base64', media_type:p.mediaType, data:p.base64 }
      });
    });
    const defaultText = photos.length > 1
      ? 'この写真たち、見てくれる？🌙'
      : 'この写真、見てくれる？🌙';
    userContent.push({ type:'text', text: t || defaultText });
  } else {
    userContent = t;
  }
  msgs.push({ role:'user', content:userContent });
  clearPhotos();

  showTyping();
  try{
    const r=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,memoryNote:memoryNote,messages:msgs})
    });
    const data=await r.json();
    hideTyping();
    const reply=data.content?.[0]?.text||'ちょっと待ってな🌙';
    msgs.push({role:'assistant',content:reply});
    addMsg('assistant',reply);
    // ── ログ送信（写真枚数も分かるように） ──
    const photoTag = photos.length ? '（＋写真'+photos.length+'枚）' : '';
    sendLog(photos.length ? (t ? t+photoTag : '（写真'+photos.length+'枚）') : t, reply);

    // ── 記憶を保存。何往復かごとに要点を作り直す ──
    saveMemory();
    turnsSinceSummary++;
    if(turnsSinceSummary >= SUMMARY_EVERY){
      turnsSinceSummary = 0;
      updateMemoryNote();          // 裏で走らせる（待たへん）
    }
  }catch(e){
    hideTyping();
    addMsg('assistant','ごめん、もう一回話しかけてみてね🌙');
  }
  loading=false;document.getElementById('sendBtn').disabled=false;
}
