<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:#FBFAF7;font-family:'Hiragino Sans','Yu Gothic',sans-serif;}
  .serif{font-family:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
  @keyframes rise{0%{opacity:0;transform:translateY(28px) scale(.82);}100%{opacity:1;transform:translateY(0) scale(1);}}
  @keyframes drift{0%{transform:translateY(-6vh) translateX(0) rotate(0);opacity:0;}14%{opacity:.5;}86%{opacity:.18;}100%{transform:translateY(108vh) translateX(18px) rotate(160deg);opacity:0;}}
  @keyframes tw{0%,100%{opacity:0;transform:scale(.4);}50%{opacity:.8;transform:scale(1);}}
  @keyframes shimmer{0%{opacity:.3;transform:translateX(-12%);}50%{opacity:.85;transform:translateX(0%);}100%{opacity:.3;transform:translateX(12%);}}
  @keyframes flash{0%{opacity:.2;}40%{opacity:1;}100%{opacity:.5;}}
  @keyframes emerge{0%{opacity:0;transform:translateY(30px) scale(.86);filter:blur(6px);}100%{opacity:1;transform:none;filter:blur(0);}}
  /* ── 妖精モーション ─────────────────── */
  /* 飛ぶ：はばたき（上下＋回転）＋わずかに左右へ流れる */
  @keyframes flyBob{0%{transform:translateY(0) rotate(-3deg);}25%{transform:translateY(-8px) rotate(2deg);}50%{transform:translateY(-2px) rotate(-1deg);}75%{transform:translateY(-9px) rotate(3deg);}100%{transform:translateY(0) rotate(-3deg);}}
  @keyframes flyDrift{0%{transform:translateX(-3px);}50%{transform:translateX(3px);}100%{transform:translateX(-3px);}}
  /* 祈り：ゆっくり傾く＋ふわり上下（周期をずらして揺れが繰り返さない） */
  @keyframes swayRot{0%{transform:rotate(-5deg);}50%{transform:rotate(5deg);}100%{transform:rotate(-5deg);}}
  @keyframes swayFloat{0%{transform:translateY(0);}50%{transform:translateY(-7px);}100%{transform:translateY(0);}}
  /* ツッコミ：右からスッと登場＋指先ピクッ2回→待機は微ゆれ */
  @keyframes tsukIn{0%{opacity:0;transform:translateX(22px) rotate(5deg);}55%{opacity:1;transform:translateX(0) rotate(0);}68%{transform:translateX(-7px) rotate(-3deg);}80%{transform:translateX(0) rotate(0);}90%{transform:translateX(-7px) rotate(-3deg);}100%{transform:translateX(0) rotate(0);}}
  @keyframes tsukIdle{0%{transform:rotate(-2.5deg);}50%{transform:rotate(2.5deg);}100%{transform:rotate(-2.5deg);}}
  @media (prefers-reduced-motion: reduce){
    [data-fairy] *{animation:none!important;}
  }
  .fu{animation:fadeUp .5s cubic-bezier(.2,.7,.3,1) both;}
  .p{position:absolute;top:-6vh;pointer-events:none;}
  .st{position:absolute;pointer-events:none;}
  @media (prefers-reduced-motion: reduce){.fu,.p,.st{animation:none!important;}.p,.st{display:none;}}
</style>
</head>

// ── リンク（ここだけ差し替えれば全部つながる）───────────────
const LINE_URL = "https://x.gd/NZs7N";

// ── 24問（8つの鏡 × 3問）／t = 裏で加点 ───────────────
const Q = [
  ["頬に、モヤっと広がるかげがある","A"],["小さな茶色い点が、前より増えた","B"],["肌が、赤くなりやすい","C"],
  ["メイクしたまま寝てしまう夜がある","D"],["グレーっぽい色味の、くすみがある","E"],["肌が、ゴワゴワしている","F"],

  ["夏のあとに、シミが増える","B"],["ニキビ跡が、なかなか消えない","C"],["お風呂をキャンセルする日がある","D"],
  ["頬骨のあたりに、色ムラが出る","E"],["化粧ノリが、悪い","F"],["冷え性である","G"],
  ["シミを触ると、ザラつく","H"],["美白を頑張るほど、肌が荒れる","A"],["日焼け止めを、塗り忘れがち","B"],
  ["つい、肌をこすってしまう","C"],["とにかく、いつも疲れている","D"],["化粧品を変えても、色が変わらない","E"],

      why:`両頬に、左右対称に。\nじわっと広く、網目のようにつながって——\nその広がり方は、\nキリンの優雅なモザイク柄そのもの。` },
  B:{ animal:"🐶", name:"紫外線シミタイプ", word:"強い日差しさえ、美しさの糧に。",

  E:{ animal:"🦚", name:"ADMタイプ", word:"深いところに眠る輝きを、解き放つ。",
      why:`肌の奥——真皮に眠る、青とグレー。\n神秘的で、奥行きがあって、\n宝石を敷きつめたような羽の模様。\n深いからこそ、美しい。` },

// 8タイプ共通のひとこと
const CREDO = `美しき個性（柄）は、\nあなたの素肌が輝くための道標`;

// 結果に出す“ひとことだけ”（＝ケアも成分も脳の話も出さない）
// 特徴・注意点（＝「あなたはこういう肌」だけ。ケア・成分は本編で）
const TOKU = {
  A:`頬にモヤっと、左右対称に広がるのが特徴。肝斑は「炎症」と「摩擦」がいちばん苦手で、美白を頑張るほど荒れることがあるタイプ。`,
  B:`小さい茶色い点がポツポツ増えたり、昔よりシミが濃くなってきた状態。紫外線でメラニンが生まれ続けてる。放っておくと、そのまま定着していく。`,
  C:`赤くなりやすい、ニキビ跡が残る、顔色が暗い……原因の多くは"無意識の摩擦"。小さな刺激が積み重なって、炎症→くすみ→色素沈着につながってる。`,
  D:`メイクしたまま寝る、お風呂キャンセル、とにかく疲れてる——これはサボりやのうて、頑張ってる証拠。肌は「回復」できてはじめて整うもの。`,
  E:`グレーっぽい・青黒い色味が、頬骨あたりに左右対称に出る。ADMは"真皮"という深い層にメラニンがあるから、表面を頑張っても届きにくい。しかも肝斑とめちゃくちゃ間違われやすい。`,
  F:`ゴワつく、透明感が出にくい、化粧ノリが悪い……原因が「優しくしすぎ」なこともある。守りに入りすぎて、古い角質が溜まったままの状態。`,
  G:`赤黒いくすみ、クマ、冷え性、むくみ——これ、実はメラニンが原因やない。血のめぐりが落ちて、肌が暗く見えてる状態。だから美白しても変わらへん。`,
  H:`境界がはっきりした濃い茶色、触るとザラつく、年齢とともに増えた。紫外線を浴びてきた時間が積もって"定着"したシミ。放っておくほど濃くなる。`,
};

const TEASER = {
  A:`鏡はこう言うてる——「がんばるほど、濃くなることがある」。<br/>その意味は、あなたの肌がいちばんよう知ってるはず🌙`,
  B:`鏡はこう言うてる——「焼けたあとの48時間に、やり直せる」。<br/>もう遅い、は……<b>ほんま？</b>🌙`,
  C:`鏡はこう言うてる——「足すより、やめてみて」。<br/>正しくやろうとするほど、肌はしんどいのかもしれん🌙`,
  D:`鏡はこう言うてる——「寝れた私、最高」。<br/>ケアする気力がない日があるのは、全力で生きてる証拠🌙`,
  E:`鏡はこう言うてる——「あなたのせいや、なかった」。<br/>ケアが届いてへんだけかもしれん。責める前に、見極めよ🌙`,
  F:`鏡はこう言うてる——「やさしくしすぎ、かも」。<br/>守るだけやのうて、巡らせることも肌には要るんよ🌙`,
  G:`鏡はこう言うてる——「白くするより、めぐらせて」。<br/>その顔色、シミやのうて“巡り”のサインかもしれん🌙`,
  H:`鏡はこう言うてる——「これは、生きてきた時間そのもの」。<br/>消すことより、ここからどうするか🌙`,
};

// 8つの鏡（色だけ）
const MIRRORS = [
  { a:"#C8873C", tint:"#F7EFE2" },

function OrnateMirror({ typeKey, w, delayed }) {
  const [imgOk, setImgOk] = useState(true);
  const width = w || 260;
  const r = R[typeKey];
  const src = IMG[typeKey];
  const contentAnim = delayed ? "emerge 1.4s cubic-bezier(.2,.7,.3,1) 1.15s both" : "none";
  return (
    <div style={{position:"relative", width:width, margin:"0 auto",
      animation:"rise 1.4s cubic-bezier(.2,.7,.3,1) both"}}>
      <div style={{position:"absolute", top:-22, left:"50%", transform:"translateX(-50%)",
        fontSize:26, zIndex:5, filter:"drop-shadow(0 2px 4px rgba(184,146,88,.5))"}}>👑</div>
      <div style={{position:"relative", borderRadius:"50% 50% 48% 48% / 42% 42% 58% 58%", padding:14,
        background:"linear-gradient(135deg,#F2E1B0,#C9A24B 30%,#8A6A2E 50%,#E8D19A 70%,#B8873C 100%)",
        boxShadow:"0 0 0 2px rgba(255,255,255,.4) inset, 0 0 40px rgba(216,190,134,.55), 0 18px 44px rgba(138,90,60,.32)"}}>
        <div style={{position:"absolute", inset:7, borderRadius:"inherit", border:"2px solid rgba(255,255,255,.45)", pointerEvents:"none"}}/>
        <div style={{position:"relative", borderRadius:"50% 50% 48% 48% / 42% 42% 58% 58%", overflow:"hidden",
          boxShadow:"inset 0 0 28px rgba(0,0,0,.32), inset 0 4px 12px rgba(255,255,255,.3)",
          minHeight:width*1.1, background:"radial-gradient(circle at 50% 40%, #FFFFFF, #F2E6F1)",
          display:"flex", alignItems:"center", justifyContent:"center"}}>
          <div style={{width:"100%", display:"flex", alignItems:"center", justifyContent:"center", animation:contentAnim}}>
            {imgOk && src
              ? <img src={src} onError={()=>setImgOk(false)} style={{width:"100%", display:"block", objectFit:"cover"}}/>
              : <div style={{textAlign:"center", padding:"30px 0"}}>
                  <div style={{fontSize:70}}>{r.animal}</div>
                </div>}
          </div>
          {delayed && <div style={{position:"absolute", inset:0, pointerEvents:"none",
            background:"radial-gradient(circle at 50% 42%, rgba(255,255,255,.95), rgba(255,245,220,.4) 45%, transparent 70%)",
            animation:"flash 1.9s ease .35s both"}}/>}
          <div style={{position:"absolute", inset:0, pointerEvents:"none", animation:"shimmer 3.6s ease-in-out infinite",
            background:"linear-gradient(122deg, rgba(255,255,255,.15) 0%, rgba(255,255,255,.75) 24%, rgba(255,255,255,.15) 40%, transparent 55%, transparent 74%, rgba(255,255,255,.4) 90%, rgba(255,255,255,.1) 100%)"}}/>
        </div>
      </div>
      <div style={{position:"absolute", bottom:-13, left:"50%", transform:"translateX(-50%)",
        fontSize:20, zIndex:5, filter:"drop-shadow(0 2px 3px rgba(184,146,88,.5))"}}>💎</div>
    </div>
  );
}

// 合言葉フル（毎部屋、必ず全部出す）
const AIKOTOBA = "鏡よ鏡、鏡さん。私が世界で一番美肌になるには、どうしたらええのん？";

// 各部屋 → { 妖精タイプ, 左右, セリフ }
// ftype: "fly"=飛ぶ / "pray"=祈り(ゆらゆら) / "tsukkomi"=ツッコミ(右)
function roomFairyNode(rm){
  const spell = <b style={{color:C.lav}}>{AIKOTOBA}</b>;
  switch(rm){
    case 0: return {ftype:"fly", side:"left", node:(<span>
      ようこそ、最初のお部屋へ🌙 鏡に合言葉を唱えてね。せーのっ💕<br/>{spell}</span>)};
    case 1: return {ftype:"pray", side:"left", node:(<span>
      2つめのお部屋🌙 手を合わせて、そっと。せーのっ💕<br/>{spell}</span>)};
    case 2: return {ftype:"tsukkomi", side:"right", node:(<span>
      3つめのお部屋🌙 せーのっ💕<br/>
      <span style={{color:C.inkSoft}}>（あなた）「鏡よ鏡、鏡さん。私が世界で一番美肌になるには、どうしたら <b style={{color:C.ink}}>いい？</b>」</span><br/>
      ちがうちがう〜、最後は<b style={{color:C.lav}}>「ええのん？」</b>やで💕 三重弁三重弁🤭<br/>{spell}</span>)};
    case 3: return {ftype:"fly", side:"left", node:(<span>
      4つめのお部屋🌙 慣れてきた？ せーのっ💕<br/>{spell}</span>)};
    case 4: return {ftype:"pray", side:"left", node:(<span>
      半分きたよ🌙 ひと呼吸おいて、心こめて。せーのっ💕<br/>{spell}</span>)};
    case 5: return {ftype:"tsukkomi", side:"right", node:(<span>
      6つめのお部屋🌙 せーのっ💕<br/>
      <span style={{color:C.inkSoft}}>（あなた）「鏡よ鏡、鏡さん。私が世界で一番美肌になるには、どうしたら <b style={{color:C.ink}}>ええのー？</b>」</span><br/>
      <b style={{color:C.lav}}>惜しいっ！</b> 語尾は「ええの<b style={{color:C.lav}}>ん</b>？」やで💕🤭<br/>{spell}</span>)};
    case 6: return {ftype:"fly", side:"left", node:(<span>
      7つめのお部屋🌙 あと少し、せーのっ💕<br/>{spell}</span>)};
    default: return {ftype:"pray", side:"left", node:(<span>
      最後のお部屋🌙 いちばん心こめて、せーのっ💕<br/>{spell}</span>)};
  }
}

function Ambient(){
  const petals=[..."✿❀✤❁✿"].map((ch,i)=>(
    <div key={i} className="p serif" style={{left:`${8+(i*17)%86}%`,fontSize:`${12+(i%3)*5}px`,
      color:i%2?"rgba(224,201,228,.55)":"rgba(216,190,134,.5)",
      animation:`drift ${14+(i%4)*3}s ${(i*1.7)%8}s linear infinite`}}>{ch}</div>
  ));
  const stars=[...Array(6)].map((_,i)=>(
    <div key={"s"+i} className="st" style={{left:`${(i*16+7)%92}%`,top:`${(i*19+8)%80}%`,
      fontSize:`${8+(i%3)*3}px`,color:C.goldSoft,animation:`tw ${2.4+(i%3)}s ${(i*.5)%3}s ease-in-out infinite`}}>✦</div>
  ));
  return <div style={{position:"fixed",inset:0,overflow:"hidden",pointerEvents:"none",zIndex:0}}>{petals}{stars}</div>;
}

function Meguri({frac}){
  return (
    <div style={{display:"flex",alignItems:"center",gap:11,background:"rgba(255,255,255,.7)",
      borderRadius:999,padding:"9px 15px",border:`1px solid ${C.line}`,boxShadow:"0 4px 16px rgba(184,127,192,.1)"}}>
      <div style={{position:"relative",width:22,height:22,borderRadius:"50%",flexShrink:0,
        border:`1px solid ${C.goldSoft}`,overflow:"hidden",
        boxShadow:`0 0 ${4+frac*10}px rgba(216,190,134,${.3+frac*.5})`}}>
        <div style={{position:"absolute",left:0,right:0,bottom:0,height:`${frac*100}%`,
          background:"linear-gradient(180deg,#F2E4BE,#D8BE86)",transition:"height .5s cubic-bezier(.2,.7,.3,1)"}}/>
      </div>
      <span className="serif" style={{fontSize:12,color:C.gold,letterSpacing:".14em",whiteSpace:"nowrap"}}>めぐり</span>
      <div style={{flex:1,height:7,background:"rgba(184,127,192,.16)",borderRadius:999,overflow:"hidden"}}>
        <div style={{height:"100%",width:`${frac*100}%`,background:"linear-gradient(90deg,#D8BE86,#E0C9E4)",
          borderRadius:999,transition:"width .5s cubic-bezier(.2,.7,.3,1)"}}/>
      </div>
    </div>
  );
}

function Fairy({node, ftype, side}){
  const right = side==="right";
  const img  = ftype==="pray" ? FAIRY_PRAY : ftype==="tsukkomi" ? FAIRY_TSU : FAIRY_FLY;
  const size = ftype==="fly" ? 66 : ftype==="pray" ? 76 : 95;   // ツッコミは大きめに
  let outerAnim, innerAnim;
  if(ftype==="fly"){        outerAnim="flyDrift 3.6s ease-in-out infinite"; innerAnim="flyBob 1.1s ease-in-out infinite"; }
  else if(ftype==="pray"){  outerAnim="swayFloat 4.3s ease-in-out infinite"; innerAnim="swayRot 3.1s ease-in-out infinite"; }
  else {                    outerAnim="tsukIdle 4.6s ease-in-out infinite"; innerAnim="tsukIn 1.15s cubic-bezier(.2,.8,.3,1) both"; }
  return (
    <div className="fu" data-fairy style={{display:"flex",flexDirection:right?"row-reverse":"row",
      gap:12,alignItems:"center",
      background:"linear-gradient(135deg,rgba(224,201,228,.16),rgba(216,190,134,.12))",
      border:`1px solid ${C.line}`,borderRadius:16,padding:"12px 14px",margin:"0 0 16px"}}>
      <div style={{flexShrink:0,width:size,animation:outerAnim,
        filter:"drop-shadow(0 3px 8px rgba(255,255,255,.55)) drop-shadow(0 6px 12px rgba(184,127,192,.14))"}}>
        <img src={img} alt="AIぼたん" onError={(e)=>{e.target.style.display='none';}}
          style={{width:"100%",display:"block",animation:innerAnim,
            filter:"saturate(.88) brightness(1.05) contrast(.96)"}}/>
      </div>
      <p className="serif" style={{margin:0,fontSize:14,lineHeight:1.95,color:C.ink,flex:1}}>{node}</p>
    </div>
  );
}

const bg={minHeight:"100vh",background:"linear-gradient(180deg,#FBFAF6 0%,#F5EAF3 60%,#FAF6F0 100%)",
  position:"relative",padding:"22px 16px 44px",color:C.ink};
const card={background:"rgba(255,255,255,.9)",borderRadius:22,padding:"22px 20px",
  border:`1px solid ${C.line}`,boxShadow:"0 10px 32px rgba(184,127,192,.12)",backdropFilter:"blur(2px)"};

function App(){
  const [screen,setScreen]=useState("intro");
  const [i,setI]=useState(0);
  const [score,setScore]=useState({});
  const [winner,setWinner]=useState(null);
  const [copied,setCopied]=useState(false);

  const begin=()=>{ setI(0); setScore({}); setWinner(null); setCopied(false); setScreen("quiz"); };

  const answer=(yes)=>{
    const t=Q[i][1];
    const ns={...score};
    if(yes) ns[t]=(ns[t]||0)+1;
    if(i+1>=Q.length){
      const order=["A","B","C","D","E","F","G","H"];
      let best=order[0], bv=-1;
      order.forEach(k=>{ const v=ns[k]||0; if(v>bv){bv=v;best=k;} });
      setScore(ns); setWinner(best); setScreen("reveal");
    }else{ setScore(ns); setI(i+1); }
  };

  const share=()=>{
    const r=R[winner];
    const text=`🪞 鏡が映した、わたしの肌は【${r.name}】${r.animal}\n「${r.word}」\n\nあなたはどの鏡に映る？\n👇\n${THIS_URL}\n\n#シミ診断 #鏡をひらく物語`;
    if(navigator.share){
      navigator.share({title:"鏡をひらく物語｜シミ診断", text:text, url:THIS_URL}).catch(()=>{});
    }else{
      navigator.clipboard.writeText(text+"\n"+THIS_URL).then(()=>{
        setCopied(true); setTimeout(()=>setCopied(false),2200);
      }).catch(()=>{});
    }
  };

  // INTRO
  if(screen==="intro"){
    return (<div style={bg}><Ambient/>
      <div style={{position:"relative",zIndex:1,maxWidth:470,margin:"0 auto",textAlign:"center"}} className="fu">
        <div className="serif" style={{fontSize:11,letterSpacing:".34em",color:C.gold,marginBottom:14}}>真実の鏡 〜True Mirror〜</div>
        <div style={{fontSize:22,marginBottom:6}}>🪞</div>

          border:`1px solid ${C.line}`,background:"rgba(255,255,255,.7)",fontSize:11.5,letterSpacing:".1em",color:C.gold}}>
          2分でひらく、はじめの鏡
        </div>
        <div style={{width:38,height:1,background:C.goldSoft,margin:"18px auto 18px"}}/>

        <div style={{width:"100%",borderRadius:20,marginBottom:20,border:`1px solid ${C.line}`,
          background:"linear-gradient(135deg,#FBF3E4,#F5EAF3,#FBF0EC)",padding:8,
          boxShadow:"inset 0 0 34px rgba(255,255,255,.6)"}}>
          <img src={HALL} alt="鏡の間" style={{width:"100%",display:"block",borderRadius:13}}/>
        </div>

        <div style={{...card,textAlign:"left"}}>
          <div className="serif" style={{fontSize:10,letterSpacing:".26em",color:C.gold,marginBottom:14}}>― ある噂話 ―</div>
          <p className="serif" style={{fontSize:14.5,lineHeight:2.2,color:C.ink,margin:0}}>
            「ねぇ、ご存知？<br/>

            「まあ……そんな夢みたいなお話が？」<br/><br/>
            「ええ。<b style={{color:C.gold}}>8つの鏡</b>をめぐると、最後に<b style={{color:C.lav}}>“ほんとうの自分の肌”</b>を映してくださるとか」<br/><br/>
            「……<b style={{color:C.lav}}>それでも、知りたいわ</b>。<br/>

              <div style={{fontSize:11,color:C.inkSoft}}>今日の案内役・ぼたんの分身</div>
            </div>
          </div>
          <p className="serif" style={{margin:0,fontSize:14,lineHeight:2,color:C.ink}}>

            </p>
          </div>
        </div>

        <div style={{width:"100%",borderRadius:20,marginTop:18,border:`1px solid ${C.line}`,
          background:"linear-gradient(135deg,#FBF3E4,#F5EAF3,#FBF0EC)",padding:8,
          boxShadow:"0 8px 26px rgba(184,127,192,.14)"}}>
          <img src={DOOR} alt="開いた扉" style={{width:"100%",display:"block",borderRadius:13}}/>
        </div>

        <button onClick={begin} className="serif" style={{width:"100%",marginTop:18,padding:"16px 0",border:"none",

          開いた扉、進んじゃう？ 🚪✨

        <div style={{marginTop:14,fontSize:11.5,color:C.inkSoft,opacity:.9,lineHeight:1.8}}>
          🌙 しっかり鏡と向き合って、お肌を観察してね
        </div>
      </div></div>);

        <div style={{display:"flex",gap:12,marginTop:18}}>

            border:`1px solid ${C.line}`,background:"transparent",color:C.ink,fontSize:15,letterSpacing:".1em",cursor:"pointer"}}>そうでもない</button>
          <button onClick={()=>answer(true)} className="serif" style={{flex:1,padding:"15px 0",borderRadius:999,border:"none",
            background:`linear-gradient(135deg,#D8BE86,${M.a})`,color:"#fff",fontSize:15,letterSpacing:".1em",cursor:"pointer",

        <div style={{textAlign:"center",marginTop:14,fontSize:11.5,color:C.inkSoft,opacity:.85,lineHeight:1.8}}>
          🌙 鏡をよく見て、正直に答えてね
        </div>
        <div style={{textAlign:"center",marginTop:8,fontSize:11,color:C.inkSoft,opacity:.7}}>{i+1} / {Q.length}</div>
      </div></div>);
  }

  // REVEAL
  if(screen==="reveal"){
    return (<div style={bg}><Ambient/>
      <div style={{position:"relative",zIndex:1,maxWidth:470,margin:"0 auto",textAlign:"center",paddingTop:20}}>
        <div style={{marginBottom:22}}><Meguri frac={1}/></div>
        <div className="serif" style={{fontSize:13,letterSpacing:".26em",color:C.gold,marginBottom:24}}>鏡が、ふっと光って——</div>
        <OrnateMirror typeKey={winner} w={270} delayed={true}/>
        <p className="serif" style={{fontSize:16,lineHeight:1.9,color:C.ink,margin:"34px 0 22px"}}>
          鏡が映した、あなたの肌は——

          boxShadow:"0 8px 24px rgba(184,127,192,.3)"}}>その子に会う ♡</button>
      </div></div>);

      <div style={{...card,marginBottom:14,
        background:"linear-gradient(135deg,rgba(216,190,134,.14),rgba(224,201,228,.16))"}}>
        <div style={{display:"flex",gap:12,alignItems:"center",marginBottom:12}}>
          <img src={BOTAN_ROUND} alt="ぼたん" onError={(e)=>{e.target.style.display='none';}}
            style={{width:60,height:60,borderRadius:"50%",objectFit:"cover",objectPosition:"50% 38%",flexShrink:0,

      </div>

      {/* 続きへ */}
      <div style={{...card,textAlign:"center",marginBottom:16}}>
        <img src={FAIRY_IMG} alt="AIぼたん" onError={(e)=>{e.target.style.display='none';}}

        <p className="serif" style={{fontSize:14,lineHeight:2.1,color:C.ink,margin:"0 0 4px"}}>
          ここで向き合ってもらった肌も、<br/>
          鏡🪞に映った内容も、<b style={{color:C.lav}}>ほんの入口</b>だけ🌙<br/><br/>
