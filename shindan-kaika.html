'use strict';const DATA={"charm": {"title": "魅力診断", "catch": "自分では普通。そこに、あなたの魅力がある。", "description": "好きなことや、気づくと自然にしていることを振り返ります。自分の日常を思い浮かべながら答えてみてください。", "types": {"A": {"emoji": "🎨", "name": "美意識", "codePhrase": "好きな美しさを選ぶ", "main": "色、形、装い、空間。自分の「これが好き」を大切にする選び方に、あなたらしさが表れています。普段使うものを選ぶことも、自分の感覚を表す小さな表現です。", "whyUnnoticed": "自分にはいつもの選び方だから。好きなものに囲まれる工夫を、日常のこととして見過ごしやすいのです。", "sign": "お気に入りを選ぶ／色や形の組み合わせを楽しむ／仕上がりを眺める。", "action": "お気に入りを一つ選んで、どこが好きかを言葉にしてみて。", "subAction": "色や形を、自分の好みに整えてみて。", "headline": "「好き」で日常を彩る人", "aruaru": ["コスメやお皿を選ぶ時、「なんか違う」と思ったら妥協できない", "素敵な写真を見つけると、つい保存してしまう", "部屋の小物の位置を、ちょっとずらしては眺めてる"], "shotai": "あなたの魅力は、「好き」を見分ける目。何が自分に似合って、何が心地いいかを、言葉より先に目でわかっている人です。", "seen": "「センスいいよね」「それどこの？」と聞かれること、ありませんか？自分では普通に選んでるだけでも、周りからはちゃんと光って見えています。", "time": "お気に入りを眺めてる時間。それはムダな時間じゃなくて、あなたの感性を磨いてる時間です。"}, "B": {"emoji": "🔍", "name": "探究", "codePhrase": "気になることを知っていく", "main": "「どうして？」「もう少し知りたい」。気になったことを確かめる姿勢に、あなたらしさが表れています。日常の小さな疑問も、自分の世界を広げる入口です。", "whyUnnoticed": "気になったら調べることが自然だから。納得するまで知る楽しさを、自分では普通と感じることがあります。", "sign": "理由が気になる／知って納得すると嬉しい／背景や仕組みに目が向く。", "action": "最近気になったことを一つ、満足するところまで調べてみて。", "subAction": "気になった理由を一つ調べてみて。", "headline": "「なんで？」から世界を広げる人", "aruaru": ["気になったら、夜中でもつい調べてしまう", "化粧品は、成分や仕組みに納得してから買いたい", "人の話を聞きながら「それって、なんで？」が浮かんでる"], "shotai": "あなたの魅力は、「なんで？」を手放さない力。わかったつもりで終わらせずに、納得するところまで確かめられる人です。", "seen": "「詳しいね」「あの人に聞いたらわかる」と思われてるかも。あなたが調べたことに、助けられてる人がきっといます。", "time": "調べて、読んで、また次を調べてる時間。気づいたら1時間たってるあの時間が、あなたの世界を広げています。"}, "C": {"emoji": "🪄", "name": "創意", "codePhrase": "自分なりの工夫を加える", "main": "「こうしたら、もっと好きかも」。手を加えたり、別の方法を試したりするところに、あなたらしさが表れています。いつものものに加えた小さな工夫にも、自分の発想が出ています。", "whyUnnoticed": "少し変えてみるのが自然だから。大きな作品を作る場面だけでなく、普段の工夫にも表れます。", "sign": "自分流に変える／作り方が気になる／使いやすい方法を考える。", "action": "身近なものや習慣を一つ、自分が楽しめる形に変えてみて。", "subAction": "自分なりの工夫を一つ足してみて。", "headline": "いつもの中に新しさを生む人", "aruaru": ["レシピ通りに作っても、つい自分流にアレンジしてしまう", "手元のものを組み合わせて、使いやすく作り替える", "「こうしたら、もっとラクかも」がすぐ浮かぶ"], "shotai": "あなたの魅力は、いつものものを少しだけ新しくする力。ゼロから作らなくても、手を加えたところにあなたらしさが出ています。", "seen": "「それ、どうやったん？」「真似していい？」と言われたこと、ありませんか？あなたの小さな工夫は、人から見るとちゃんと新しいんです。", "time": "ああでもない、こうでもないと手を動かしてる時間。その試行錯誤そのものが、あなたの発想を育てています。"}, "D": {"emoji": "🫧", "name": "感受性", "codePhrase": "心が動く瞬間を味わう", "main": "言葉、音、触り心地、その場の空気。感じたことを大切にするところに、あなたらしさが表れています。「なんか好き」「今日はこっちが心地いい」も、自分を知る手がかりです。", "whyUnnoticed": "自分が感じたことは、自分には自然だから。心地よさや小さな変化を味わう時間に、その感覚が表れます。", "sign": "雰囲気に惹かれる／音楽や景色に浸る／その日の感覚を大切にする。", "action": "今日、心地よかったものを一つ選んで、ゆっくり味わってみて。", "subAction": "色・音・触り心地など、心地よい感覚を確かめてみて。", "headline": "心が動く瞬間をすくう人", "aruaru": ["お店に入った瞬間、「なんか好き」「なんか違う」がわかる", "同じ服でも、肌触りで選んでいる", "誰かの何気ない一言を、何日も覚えてる"], "shotai": "あなたの魅力は、空気を受け取るアンテナ。みんなが見過ごす小さな心地よさや変化を、ちゃんと受け取れる人です。", "seen": "「あの人といると、なんか落ち着く」と思われてるかも。あなたが心地よさを選んでいるから、そばにいる人もほっとするんです。", "time": "音楽をかけて、ぼーっとしてる時間。それはサボりじゃなくて、あなたが充電している時間なんです。"}, "E": {"emoji": "🌷", "name": "慈しみ", "codePhrase": "大切なものをいたわる", "main": "自分、植物、動物、使い慣れたもの。大切なものが心地よくあるように扱うところに、あなたらしさが表れています。自分一人の暮らしにも、その温かさは表れます。", "whyUnnoticed": "大切なものを丁寧に扱うことが自然だから。誰かのために役立つ場面以外にも、暮らしの中に表れています。", "sign": "大切なものの世話をする／負担を軽くする工夫を選ぶ／いたわる時間が好き。", "action": "大切なものを一つ、いつもより丁寧に扱ってみて。自分自身を選んでもいい。", "subAction": "自分や大切なものが心地よいように整えてみて。", "headline": "大切なものに心地よさを贈る人", "aruaru": ["肌の調子を見て、その日のスキンケアを変えている", "植物やペットの「いつもと違う」にすぐ気づく", "誰も見てなくても、タオルはふわっとたたみたい"], "shotai": "あなたの魅力は、「今、何が必要か」に気づけるやさしさ。自分にも大切なものにも、ちょうどいい手のかけ方がわかる人です。", "seen": "「あなたのそばは居心地がいい」と思われてるかも。あなたが整えた空気の中で、周りの人もゆるんでいます。", "time": "誰に見せるでもない、ひと手間をかけてる時間。その時間が、あなた自身も満たしてくれています。"}, "F": {"emoji": "🎈", "name": "遊び心", "codePhrase": "日常を面白がる", "main": "「それ、面白そう」「ちょっとやってみよう」。日常に楽しさや意外性を見つけるところに、あなたらしさが表れています。一人で笑ったことや、自分だけの楽しみも、その手がかりです。", "whyUnnoticed": "楽しむ工夫を、自然に選んでいるから。人前で場を盛り上げる経験だけでなく、自分の楽しみにも表れます。", "sign": "意外な発想が好き／日常に遊びを加える／面白かったことを思い返す。", "action": "いつもの作業に、自分が笑える工夫を一つ加えてみて。", "subAction": "自分が面白がれる遊びを一つ加えてみて。", "headline": "日常に楽しさを見つける人", "aruaru": ["しんどい時でも、ちょっと笑えるところを探してしまう", "新作や限定品に「面白そう」で手が伸びる", "家事にもつい、自分ルールのゲームを作ってる"], "shotai": "あなたの魅力は、日常を面白がる力。同じ毎日でも、楽しめる角度を見つけられる人です。", "seen": "「あなたといると楽しい」「なんか元気出る」と言われたこと、ありませんか？あなたの笑いは、周りの空気まで軽くしています。", "time": "くだらないことで笑ってる時間。それはムダじゃなくて、あなたが自分を軽くしている時間です。"}, "G": {"emoji": "🧩", "name": "編集", "codePhrase": "好きなものをつなぐ", "main": "情報、経験、持ち物、アイデア。別々のものを組み合わせ、自分なりにまとめるところに、あなたらしさが表れています。お気に入りの並べ方にも、自分だけの共通点が出ています。", "whyUnnoticed": "つながりを考えたりまとめたりするのが自然だから。人を紹介する経験が少なくても、手元の材料の扱い方に表れます。", "sign": "別の話とつなげる／集めたものを組み合わせる／整理してまとまると嬉しい。", "action": "好きなものを三つ並べて、全部に共通する好きを一つ見つけてみて。", "subAction": "好きなものを別の経験やアイデアと組み合わせてみて。", "headline": "好きなものをつないで世界をつくる人", "aruaru": ["保存した写真や投稿が、テーマごとに分けてある", "全然違う話を聞いて「それ、あれと一緒やん」とつながる", "バラバラのメモを、ついまとめ直したくなる"], "shotai": "あなたの魅力は、好きなものをつなげて自分の世界にする力。集めたものの中から、自分だけの共通点を見つけられる人です。", "seen": "「話がわかりやすい」「まとめてくれて助かる」と思われてるかも。あなたが整理したものに、周りは助けられています。", "time": "集めたものを並べ替えたり、見返したりしてる時間。そこで、あなたの「好き」の地図ができあがっていきます。"}}, "questions": [{"id": "q01", "kind": "scale", "type": "A", "text": "肌のツヤ、メイクの色、服や部屋の雰囲気など、「これ、好き」と思える見た目に自然と目が向く。", "options": [{"id": "q01_0", "value": 0, "text": "ほとんどない"}, {"id": "q01_1", "value": 1, "text": "ときどきある"}, {"id": "q01_2", "value": 2, "text": "よくある"}, {"id": "q01_3", "value": 3, "text": "気づくとそうしている"}, {"id": "q01_u", "value": null, "text": "まだ分からない"}]}, {"id": "q02", "kind": "scale", "type": "B", "text": "美容の成分、ものの仕組み、気になった言葉など、「どうして？」と思うと、つい調べる。", "options": [{"id": "q02_0", "value": 0, "text": "ほとんどない"}, {"id": "q02_1", "value": 1, "text": "ときどきある"}, {"id": "q02_2", "value": 2, "text": "よくある"}, {"id": "q02_3", "value": 3, "text": "気づくとそうしている"}, {"id": "q02_u", "value": null, "text": "まだ分からない"}]}, {"id": "q03", "kind": "scale", "type": "C", "text": "メイク、料理、ものづくり、いつもの作業などに、「自分ならこうしてみよう」と工夫を加える。", "options": [{"id": "q03_0", "value": 0, "text": "ほとんどない"}, {"id": "q03_1", "value": 1, "text": "ときどきある"}, {"id": "q03_2", "value": 2, "text": "よくある"}, {"id": "q03_3", "value": 3, "text": "気づくとそうしている"}, {"id": "q03_u", "value": null, "text": "まだ分からない"}]}, {"id": "q04", "kind": "scale", "type": "D", "text": "香り、肌触り、音楽、景色、言葉などから、細かな違いや、その時の空気を感じ取る。", "options": [{"id": "q04_0", "value": 0, "text": "ほとんどない"}, {"id": "q04_1", "value": 1, "text": "ときどきある"}, {"id": "q04_2", "value": 2, "text": "よくある"}, {"id": "q04_3", "value": 3, "text": "気づくとそうしている"}, {"id": "q04_u", "value": null, "text": "まだ分からない"}]}, {"id": "q05", "kind": "scale", "type": "E", "text": "自分の肌や身体、植物、動物、大切なものの様子を見て、今の状態に合う扱い方を考える。", "options": [{"id": "q05_0", "value": 0, "text": "ほとんどない"}, {"id": "q05_1", "value": 1, "text": "ときどきある"}, {"id": "q05_2", "value": 2, "text": "よくある"}, {"id": "q05_3", "value": 3, "text": "気づくとそうしている"}, {"id": "q05_u", "value": null, "text": "まだ分からない"}]}, {"id": "q06", "kind": "scale", "type": "F", "text": "何気ない出来事の中で、面白いところや、ちょっと笑える見方を見つける。", "options": [{"id": "q06_0", "value": 0, "text": "ほとんどない"}, {"id": "q06_1", "value": 1, "text": "ときどきある"}, {"id": "q06_2", "value": 2, "text": "よくある"}, {"id": "q06_3", "value": 3, "text": "気づくとそうしている"}, {"id": "q06_u", "value": null, "text": "まだ分からない"}]}, {"id": "q07", "kind": "scale", "type": "G", "text": "集めた美容情報、写真、持ち物、経験などを、自分なりに整理したり、組み合わせたりする。", "options": [{"id": "q07_0", "value": 0, "text": "ほとんどない"}, {"id": "q07_1", "value": 1, "text": "ときどきある"}, {"id": "q07_2", "value": 2, "text": "よくある"}, {"id": "q07_3", "value": 3, "text": "気づくとそうしている"}, {"id": "q07_u", "value": null, "text": "まだ分からない"}]}, {"id": "q08", "kind": "scale", "type": "A", "text": "色や形、仕上がりを選び始めると、「ちょっとだけ」のつもりが、自分好みになるまで時間を使っている。", "options": [{"id": "q08_0", "value": 0, "text": "ほとんどない"}, {"id": "q08_1", "value": 1, "text": "ときどきある"}, {"id": "q08_2", "value": 2, "text": "よくある"}, {"id": "q08_3", "value": 3, "text": "気づくとそうしている"}, {"id": "q08_u", "value": null, "text": "まだ分からない"}]}, {"id": "q09", "kind": "scale", "type": "B", "text": "ひとつ分かると次の疑問が浮かび、気づいたら、最初に知りたかったことより深く調べている。", "options": [{"id": "q09_0", "value": 0, "text": "ほとんどない"}, {"id": "q09_1", "value": 1, "text": "ときどきある"}, {"id": "q09_2", "value": 2, "text": "よくある"}, {"id": "q09_3", "value": 3, "text": "気づくとそうしている"}, {"id": "q09_u", "value": null, "text": "まだ分からない"}]}, {"id": "q10", "kind": "scale", "type": "C", "text": "手元にあるものや、いつもの方法を見て、別の使い方や、自分に合うやり方が浮かぶ。", "options": [{"id": "q10_0", "value": 0, "text": "ほとんどない"}, {"id": "q10_1", "value": 1, "text": "ときどきある"}, {"id": "q10_2", "value": 2, "text": "よくある"}, {"id": "q10_3", "value": 3, "text": "気づくとそうしている"}, {"id": "q10_u", "value": null, "text": "まだ分からない"}]}, {"id": "q11", "kind": "scale", "type": "D", "text": "音楽、映画、景色、誰かの言葉などに触れたあと、その余韻を味わったり、自分の気持ちを確かめたりしている。", "options": [{"id": "q11_0", "value": 0, "text": "ほとんどない"}, {"id": "q11_1", "value": 1, "text": "ときどきある"}, {"id": "q11_2", "value": 2, "text": "よくある"}, {"id": "q11_3", "value": 3, "text": "気づくとそうしている"}, {"id": "q11_u", "value": null, "text": "まだ分からない"}]}, {"id": "q12", "kind": "scale", "type": "E", "text": "誰かに見せるためでなくても、自分や大切なものが心地よく過ごせるよう、ひと手間かける。", "options": [{"id": "q12_0", "value": 0, "text": "ほとんどない"}, {"id": "q12_1", "value": 1, "text": "ときどきある"}, {"id": "q12_2", "value": 2, "text": "よくある"}, {"id": "q12_3", "value": 3, "text": "気づくとそうしている"}, {"id": "q12_u", "value": null, "text": "まだ分からない"}]}, {"id": "q13", "kind": "scale", "type": "F", "text": "新しいメイクの色、初めての体験、いつもと違う組み合わせなど、「面白そう」で試したくなる。", "options": [{"id": "q13_0", "value": 0, "text": "ほとんどない"}, {"id": "q13_1", "value": 1, "text": "ときどきある"}, {"id": "q13_2", "value": 2, "text": "よくある"}, {"id": "q13_3", "value": 3, "text": "気づくとそうしている"}, {"id": "q13_u", "value": null, "text": "まだ分からない"}]}, {"id": "q14", "kind": "scale", "type": "G", "text": "別々に知ったことや経験したことの間に、「これとこれ、つながるかも」と共通点を見つける。", "options": [{"id": "q14_0", "value": 0, "text": "ほとんどない"}, {"id": "q14_1", "value": 1, "text": "ときどきある"}, {"id": "q14_2", "value": 2, "text": "よくある"}, {"id": "q14_3", "value": 3, "text": "気づくとそうしている"}, {"id": "q14_u", "value": null, "text": "まだ分からない"}]}], "mainLabel": "日常に表れている魅力", "subLabel": "一緒に表れた魅力", "cta": "もっと「私の場合」を、ぼたんと一緒に。", "id": "charm", "version": "4.0.0", "note": "今回の回答から、自分を知る手がかりを整理した結果です。能力や将来の成果を測定するものではありません。", "minimumEvidence": 8, "pairs": {"A_ Used": "アイデアが作品や企画として形になり、あなたらしい工夫が伝わります。", "action": "アイデアを一つ選んで、15分で小さな試作品をつくってみて。", "subAction": "小さな試作品をつくる", "headline": "「あったらいいな」を生み出す人", "tanso": "「考えてばっかりで、形にしてない」「思いつきが多い」と、自分で思っていませんか？", "jitsuwa": "それは、まだ世の中にないものを思い描ける力です。アイデアがたくさん浮かぶのは、ちゃんと才能なんです。", "hiraku": "思いつきが、企画や商品やサービスになっていきます。あなたの「こんなのあったらいいのに」が、誰かの「これが欲しかった」に変わります。", "nemutta": "「形にするのは大変」「私なんかが」と、思いついた瞬間に自分でしまい込んできたから。"}, "B": {"emoji": "👑", "name": "影響", "codePhrase": "人や場の動きを見て働きかける", "main": "人や場の配置、流れを変えることに関心が集まっています。周囲の希望を聞き、自分の提案を出す経験がこの原石の入口です。", "sign": "全体の配置が気になる／企画の広がりを考える／場を動かす人に惹かれる", "whyUnnoticed": "全体の動きを見て考えるのが自然だから。", "condition": "小さな提案を出せる場と、関わる人の希望を聞く時間。", "whenUsed": "自分の提案が人と共有され、企画や場の動きへ育っていきます。", "action": "身近な場で変えたいことを一つ選んで、関係する一人に提案してみて。", "subAction": "関係する人に具体的な提案を出す", "headline": "新しい流れをつくる人", "tanso": "「口うるさいかも」「仕切りたがりと思われそう」と、言いたいことを飲み込んできませんでしたか？", "jitsuwa": "それは、場の全体を見て「こうしたら動く」がわかる力です。流れが見えている人にしか言えない言葉なんです。", "hiraku": "あなたの一言で、場が動き出します。チームやコミュニティの中で「あの人がいると進む」と頼られる人になります。", "nemutta": "前に出ることを「出しゃばり」やと思って、一歩引く癖がついていたから。"}, "C": {"emoji": "🔮", "name": "感覚", "codePhrase": "小さな違いや兆しを拾う", "main": "言葉になる前の好き嫌いや、小さな違いに関心が集まっています。感じたことを言葉にして確かめると、この原石を判断に使えます。", "sign": "違和感が気になる／理由より先に反応する／小さな違いを拾う", "whyUnnoticed": "気づいたことが、自分には当たり前に見えるから。", "condition": "感覚をメモし、事実と照らして小さく確かめる時間。", "whenUsed": "感覚が言葉や観察と結びつき、自分の選択の材料になります。", "action": "気になった違いを一つ書いて、何を見てそう感じたかも添えてみて。", "subAction": "感覚をメモして事実と照らす", "headline": "まだ見えない可能性に気づく人", "tanso": "「気にしすぎ」「考えすぎ」「なんでそんなとこ気づくん？」と言われてきませんでしたか？", "jitsuwa": "それは、まだ誰も気づいていないことに、一番に気づける力です。", "hiraku": "人が言葉にしていない本音や、まだ形になっていない可能性に気づける人になります。「あなたに言われて気づいた」と言われることが増えていきます。", "nemutta": "感じたことを「気のせいかも」と、自分で打ち消してきたから。"}, "D": {"emoji": "📣", "name": "表現", "codePhrase": "内側の世界を言葉や作品で届ける", "main": "見せ方や言葉、自分の世界を外へ届けることに関心が集まっています。一人へ伝える経験から、この原石を使い始められます。", "sign": "言葉選びが気になる／作品を見せたくなる／表現する人に惹かれる", "whyUnnoticed": "伝え方を考えることが自然だから。", "condition": "届けたい相手が一人見えることと、小さく発表できる場所。", "whenUsed": "内側にある考えや感情が届き、人との対話が始まります。", "action": "「私にはこう見える」を3行で書いて、一人に届けてみて。", "subAction": "考えを短い言葉や作品にして一人へ届ける", "headline": "自分の世界を届ける人", "tanso": "「私なんかが発信しても」「自分語りっぽくて恥ずかしい」と、出す手前で止まっていませんか？", "jitsuwa": "それは、伝えたいものが内側にちゃんとある証拠です。言葉や見せ方が気になるのは、届け方のセンスがあるから。", "hiraku": "あなたの言葉や作品に、共感する人が集まってきます。「それ、私も思ってた」と言われる発信ができる人です。", "nemutta": "人の目や反応が気になって、見せる前に自分でダメ出ししてきたから。"}, "E": {"emoji": "🌱", "name": "育成", "codePhrase": "人の可能性を見つけて育ちに関わる", "main": "人の伸びしろに気づき、教えたり手伝ったりする方向に関心が集まっています。本人の望みを聞いて一歩を支えることが入口です。", "sign": "もっと伸びそうと思う／教える／人を育てる姿に惹かれる", "whyUnnoticed": "できそうなことを見つけて手伝うのが自然だから。", "condition": "本人が望むことと、できたことを一緒に確かめる機会。", "whenUsed": "相手の選択を尊重しながら、成長を支える関わりが育ちます。", "action": "一人に「今、できるようになりたいことは？」と聞いて、一歩だけ手伝ってみて。", "subAction": "本人が望む一歩を聞いて支える", "headline": "誰かの「できる」を咲かせる人", "tanso": "「おせっかいかな」「人のことばっかり気にしてる」と、自分を責めたことはありませんか？", "jitsuwa": "それは、人の伸びしろが見える力です。本人より先に「この人、もっといける」がわかるのは、育てる才能です。", "hiraku": "あなたの一言で、誰かが一歩を踏み出します。教える、伝える、背中を押す。その関わりが、仕事にも広がっていきます。", "nemutta": "人のことより、まず自分がちゃんとせな、と後回しにしてきたから。"}, "F": {"emoji": "🧭", "name": "開拓", "codePhrase": "未知を試して経験を道にする", "main": "初めての場所や方法、別のやり方に関心が集まっています。小さく試して体験を言葉にすると、この原石が次の選択につながります。", "sign": "知らないことを試す／別の方法を考える／未知の経験に惹かれる", "whyUnnoticed": "新しいものを試すことが、自分には自然だから。", "condition": "時間や費用を決めて試せる機会と、体験を振り返る時間。", "whenUsed": "自分の経験が道になり、次に選べる世界が広がります。", "action": "初めての方法を一つ、時間とお金の範囲を決めて試してみて。", "subAction": "小さな未知の方法を試す", "headline": "自分の世界を広げていく人", "tanso": "「飽きっぽい」「落ち着きがない」「続かへん」と、気にしていませんか？", "jitsuwa": "それは、新しい世界に飛び込める力です。知らない場所や方法に惹かれるのは、道を切り開く人の特徴なんです。", "hiraku": "試した経験の一つひとつが、あなただけの道になります。誰もやっていないことに、最初に手を伸ばせる人です。", "nemutta": "「一つのことを続けるのが正しい」と思って、気になる気持ちにブレーキをかけてきたから。"}, "G": {"emoji": "🏰", "name": "統合", "codePhrase": "バラバラな経験を一つの世界にまとめる", "main": "知識や経験のつながりを見つける方向に関心が集まっています。共通点を一つの図や仕組みにすると、この原石が外から見える形になります。", "sign": "別の知識とつなぐ／組み合わせる／自分なりの体系を考える", "whyUnnoticed": "つながって見えることが、自分には自然だから。", "condition": "材料を並べて眺める時間と、一つの形にまとめる用途。", "whenUsed": "経験や考えが一つの体系となり、あなたらしい世界を伝えられます。", "action": "経験を三つ書き出して、共通するテーマを一つ見つけてみて。", "subAction": "材料の共通点を一つの図や仕組みにする", "headline": "経験を宝物に変える人", "tanso": "「いろいろやってきたけど、どれも中途半端」と思っていませんか？", "jitsuwa": "それは、バラバラの経験をつなげられる力です。回り道に見えた全部が、あなただけの材料なんです。", "hiraku": "これまでの経験が、一つの考え方や仕組み、講座になっていきます。「あなたにしか話せないこと」が見えてきます。", "nemutta": "経験を一つずつの「点」で見て、つながりを眺める時間をとってこなかったから。"}}, "questions": [{"id": "q01", "kind": "scale", "type": "A", "text": "既にあるものを選ぶだけでなく、自分のアイデアから、作品・企画・方法などを生み出すことに惹かれる。", "options": [{"id": "q01_0", "value": 0, "text": "ほとんど当てはまらない"}, {"id": "q01_1", "value": 1, "text": "少し当てはまる"}, {"id": "q01_2", "value": 2, "text": "かなり当てはまる"}, {"id": "q01_3", "value": 3, "text": "とても当てはまる"}, {"id": "q01_u", "value": null, "text": "まだ分からない"}]}, {"id": "q02", "kind": "scale", "type": "B", "text": "場や企画を見ると、「こう変わったら、全体が動きそう」と考える。", "options": [{"id": "q02_0", "value": 0, "text": "ほとんど当てはまらない"}, {"id": "q02_1", "value": 1, "text": "少し当てはまる"}, {"id": "q02_2", "value": 2, "text": "かなり当てはまる"}, {"id": "q02_3", "value": 3, "text": "とても当てはまる"}, {"id": "q02_u", "value": null, "text": "まだ分からない"}]}, {"id": "q03", "kind": "scale", "type": "C", "text": "まだ理由を説明できなくても、「なんか気になる」「ここが違う」という小さな反応が浮かぶ。", "options": [{"id": "q03_0", "value": 0, "text": "ほとんど当てはまらない"}, {"id": "q03_1", "value": 1, "text": "少し当てはまる"}, {"id": "q03_2", "value": 2, "text": "かなり当てはまる"}, {"id": "q03_3", "value": 3, "text": "とても当てはまる"}, {"id": "q03_u", "value": null, "text": "まだ分からない"}]}, {"id": "q04", "kind": "scale", "type": "D", "text": "自分の中にある考え、感情、世界観を、言葉・写真・作品・声などで届けることに惹かれる。", "options": [{"id": "q04_0", "value": 0, "text": "ほとんど当てはまらない"}, {"id": "q04_1", "value": 1, "text": "少し当てはまる"}, {"id": "q04_2", "value": 2, "text": "かなり当てはまる"}, {"id": "q04_3", "value": 3, "text": "とても当てはまる"}, {"id": "q04_u", "value": null, "text": "まだ分からない"}]}, {"id": "q05", "kind": "scale", "type": "E", "text": "人ができたことや工夫を見て、「ここから、もっと伸びそう」と可能性が浮かぶ。", "options": [{"id": "q05_0", "value": 0, "text": "ほとんど当てはまらない"}, {"id": "q05_1", "value": 1, "text": "少し当てはまる"}, {"id": "q05_2", "value": 2, "text": "かなり当てはまる"}, {"id": "q05_3", "value": 3, "text": "とても当てはまる"}, {"id": "q05_u", "value": null, "text": "まだ分からない"}]}, {"id": "q06", "kind": "scale", "type": "F", "text": "初めての場所や方法に触れると、実際に経験して、自分で確かめてみたくなる。", "options": [{"id": "q06_0", "value": 0, "text": "ほとんど当てはまらない"}, {"id": "q06_1", "value": 1, "text": "少し当てはまる"}, {"id": "q06_2", "value": 2, "text": "かなり当てはまる"}, {"id": "q06_3", "value": 3, "text": "とても当てはまる"}, {"id": "q06_u", "value": null, "text": "まだ分からない"}]}, {"id": "q07", "kind": "scale", "type": "G", "text": "別々の知識や経験を、ひとつの考え方・仕組み・世界としてまとめることに惹かれる。", "options": [{"id": "q07_0", "value": 0, "text": "ほとんど当てはまらない"}, {"id": "q07_1", "value": 1, "text": "少し当てはまる"}, {"id": "q07_2", "value": 2, "text": "かなり当てはまる"}, {"id": "q07_3", "value": 3, "text": "とても当てはまる"}, {"id": "q07_u", "value": null, "text": "まだ分からない"}]}, {"id": "q08", "kind": "scale", "type": "A", "text": "完成されたものに触れた時も、「別の形にしたら？」「こんなものがあったら？」と、新しい案が浮かぶ。", "options": [{"id": "q08_0", "value": 0, "text": "ほとんど当てはまらない"}, {"id": "q08_1", "value": 1, "text": "少し当てはまる"}, {"id": "q08_2", "value": 2, "text": "かなり当てはまる"}, {"id": "q08_3", "value": 3, "text": "とても当てはまる"}, {"id": "q08_u", "value": null, "text": "まだ分からない"}]}, {"id": "q09", "kind": "scale", "type": "B", "text": "誰かの企画や取り組みを見て、自分も方向を示したり、人や場を動かしたりする側をやってみたいと思う。", "options": [{"id": "q09_0", "value": 0, "text": "ほとんど当てはまらない"}, {"id": "q09_1", "value": 1, "text": "少し当てはまる"}, {"id": "q09_2", "value": 2, "text": "かなり当てはまる"}, {"id": "q09_3", "value": 3, "text": "とても当てはまる"}, {"id": "q09_u", "value": null, "text": "まだ分からない"}]}, {"id": "q10", "kind": "scale", "type": "C", "text": "言葉になる前の感覚を大切にしている人を見ると、自分も、その感覚をもっと確かめて使ってみたいと思う。", "options": [{"id": "q10_0", "value": 0, "text": "ほとんど当てはまらない"}, {"id": "q10_1", "value": 1, "text": "少し当てはまる"}, {"id": "q10_2", "value": 2, "text": "かなり当てはまる"}, {"id": "q10_3", "value": 3, "text": "とても当てはまる"}, {"id": "q10_u", "value": null, "text": "まだ分からない"}]}, {"id": "q11", "kind": "scale", "type": "D", "text": "表現している人を見ると、「私にも外へ出してみたいものがある」と感じる。", "options": [{"id": "q11_0", "value": 0, "text": "ほとんど当てはまらない"}, {"id": "q11_1", "value": 1, "text": "少し当てはまる"}, {"id": "q11_2", "value": 2, "text": "かなり当てはまる"}, {"id": "q11_3", "value": 3, "text": "とても当てはまる"}, {"id": "q11_u", "value": null, "text": "まだ分からない"}]}, {"id": "q12", "kind": "scale", "type": "E", "text": "人が一歩進めるように、分かりやすい伝え方や、試しやすい方法を考えることに惹かれる。", "options": [{"id": "q12_0", "value": 0, "text": "ほとんど当てはまらない"}, {"id": "q12_1", "value": 1, "text": "少し当てはまる"}, {"id": "q12_2", "value": 2, "text": "かなり当てはまる"}, {"id": "q12_3", "value": 3, "text": "とても当てはまる"}, {"id": "q12_u", "value": null, "text": "まだ分からない"}]}, {"id": "q13", "kind": "scale", "type": "F", "text": "いつものやり方に加えて、まだ経験したことのない選択肢にも関心が向く。", "options": [{"id": "q13_0", "value": 0, "text": "ほとんど当てはまらない"}, {"id": "q13_1", "value": 1, "text": "少し当てはまる"}, {"id": "q13_2", "value": 2, "text": "かなり当てはまる"}, {"id": "q13_3", "value": 3, "text": "とても当てはまる"}, {"id": "q13_u", "value": null, "text": "まだ分からない"}]}, {"id": "q14", "kind": "scale", "type": "G", "text": "これまで学んだことや経験したことを眺めて、「これをまとめたら、自分らしい何かになりそう」と感じる。", "options": [{"id": "q14_0", "value": 0, "text": "ほとんど当てはまらない"}, {"id": "q14_1", "value": 1, "text": "少し当てはまる"}, {"id": "q14_2", "value": 2, "text": "かなり当てはまる"}, {"id": "q14_3", "value": 3, "text": "とても当てはまる"}, {"id": "q14_u", "value": null, "text": "まだ分からない"}]}, {"id": "q15", "kind": "rating", "type": "A", "text": "今の暮らしの中で、自分発のアイデアを、作品・企画・工夫など、実際の形にしている。", "options": [{"id": "q15_0", "value": 0, "text": "ほぼ使っていない"}, {"id": "q15_1", "value": 1, "text": "たまに使っている"}, {"id": "q15_2", "value": 2, "text": "よく使っている"}, {"id": "q15_3", "value": 3, "text": "かなり使っている"}, {"id": "q15_u", "value": null, "text": "まだ分からない"}]}, {"id": "q16", "kind": "rating", "type": "B", "text": "今の暮らしの中で、自分の提案や働きかけによって、人や場の動きに関わっている。", "options": [{"id": "q16_0", "value": 0, "text": "ほぼ使っていない"}, {"id": "q16_1", "value": 1, "text": "たまに使っている"}, {"id": "q16_2", "value": 2, "text": "よく使っている"}, {"id": "q16_3", "value": 3, "text": "かなり使っている"}, {"id": "q16_u", "value": null, "text": "まだ分からない"}]}, {"id": "q17", "kind": "rating", "type": "C", "text": "今の暮らしの中で、感じた違和感や直感を、事実と照らしながら、自分の判断に取り入れている。", "options": [{"id": "q17_0", "value": 0, "text": "ほぼ使っていない"}, {"id": "q17_1", "value": 1, "text": "たまに使っている"}, {"id": "q17_2", "value": 2, "text": "よく使っている"}, {"id": "q17_3", "value": 3, "text": "かなり使っている"}, {"id": "q17_u", "value": null, "text": "まだ分からない"}]}, {"id": "q18", "kind": "rating", "type": "D", "text": "今の暮らしの中で、自分の考え・気持ち・世界観を、言葉・写真・作品・声などで外へ届けている。", "options": [{"id": "q18_0", "value": 0, "text": "ほぼ使っていない"}, {"id": "q18_1", "value": 1, "text": "たまに使っている"}, {"id": "q18_2", "value": 2, "text": "よく使っている"}, {"id": "q18_3", "value": 3, "text": "かなり使っている"}, {"id": "q18_u", "value": null, "text": "まだ分からない"}]}, {"id": "q19", "kind": "rating", "type": "E", "text": "今の暮らしの中で、本人が望んでいることを聞き、その人が伸びたり、一歩進んだりすることに関わっている。", "options": [{"id": "q19_0", "value": 0, "text": "ほぼ使っていない"}, {"id": "q19_1", "value": 1, "text": "たまに使っている"}, {"id": "q19_2", "value": 2, "text": "よく使っている"}, {"id": "q19_3", "value": 3, "text": "かなり使っている"}, {"id": "q19_u", "value": null, "text": "まだ分からない"}]}, {"id": "q20", "kind": "rating", "type": "F", "text": "今の暮らしの中で、初めての場所・方法・経験を、自分から選んで試している。", "options": [{"id": "q20_0", "value": 0, "text": "ほぼ使っていない"}, {"id": "q20_1", "value": 1, "text": "たまに使っている"}, {"id": "q20_2", "value": 2, "text": "よく使っている"}, {"id": "q20_3", "value": 3, "text": "かなり使っている"}, {"id": "q20_u", "value": null, "text": "まだ分からない"}]}, {"id": "q21", "kind": "rating", "type": "G", "text": "今の暮らしの中で、自分の経験・知識・アイデアを、ひとつの形や仕組みにまとめている。", "options": [{"id": "q21_0", "value": 0, "text": "ほぼ使っていない"}, {"id": "q21_1", "value": 1, "text": "たまに使っている"}, {"id": "q21_2", "value": 2, "text": "よく使っている"}, {"id": "q21_3", "value": 3, "text": "かなり使っている"}, {"id": "q21_u", "value": null, "text": "まだ分からない"}]}, {"id": "q22", "kind": "reflection", "text": "今の自分について、一番近いのは？", "options": [{"id": "q22_0", "value": 0, "text": "これから試してみたい自分が、たくさんいる"}, {"id": "q22_1", "value": と思えるものが見えたら、ほかを一度置いて、そこに時間を集めてみて。"}, "D": {"emoji": "🪁", "name": "ご縁ジャンプ", "codePhrase": "人とのつながりから次の扉を開く", "main": "出会いや紹介をきっかけに、新しい選択肢を見つける力。誰と接点を持った時に流れが変わったかが、次の一歩の材料になります。", "sign": "会いたい人や話してみたい人が浮かぶ。", "condition": "相手への関心を言葉にすると、具体的な会話が始まります。", "action": "今浮かぶ一人に、話したい理由を添えて連絡してみて。", "boostAction": "話してみたい人と接点をつくる", "headline": "出会いから、次の扉をひらく人", "hosoku": "振り返ると、あなたの人生が動いた時には、いつも「人」がいました。誰かに会った、紹介された、誘われた。", "tomaru": "一人で正解を探して、誰にも会わずにいる時ほど、流れが止まります。", "nami": "「なんか、この人と話してみたい」と思ったら、それが合図。理由はあとでいい。会いに行って。"}, "E": {"emoji": "🦢", "name": "巻き込み", "codePhrase": "やりたいことを言葉にして人と進める", "main": "望みや企画を外へ出すと、協力や情報を集めやすい力。過去に発信や宣言のあとで話が進んだ経験が表れています。", "sign": "人に話したいアイデアが増える。", "condition": "望みと具体的に頼みたいことを伝えると、参加する側も動きやすくなります。", "action": "「これをやりたい。まずここを手伝ってほしい」を一人に伝えてみて。", "boostAction": "望みと協力してほしいことを伝える", "headline": "「やりたい」を旗にして、進む人", "hosoku": "振り返ると、話が進んだ時は、いつも「やりたい」を口に出したあとでした。言葉にした瞬間から、人と情報が集まってくる人です。", "tomaru": "「ちゃんと形になってから言おう」と黙っている時ほど、一人で抱えて止まってしまいます。", "nami": "まだ途中でも、「これやりたいねん」と一人に話してみて。旗を立てた人のところに、応援は集まります。"}, "F": {"emoji": "🎈", "name": "受取拡大", "codePhrase": "差し出された助けを受け取って広げる", "main": "好意や協力を受け取り、新しい経験へつなげる力。受け取ったあとにどう動いたかまで振り返ると、あなたの飛び方が見えてきます。", "sign": "協力の申し出や誘いが届く。", "condition": "内容や条件を確かめ、自分が望む助けを選んで受け取ると一歩が具体化します。", "action": "今日もらった好意に「ありがとう♡」を伝えて、必要なら一つ助けを頼んでみて。", "boostAction": "内容や条件を確かめて望む助けを受け取る", "headline": "差し出された手から、世界を広げる人", "hosoku": "振り返ると、あなたの世界が広がった時は、誰かが差し出してくれた手を受け取った時でした。", "tomaru": "「迷惑かけたくない」「自分でなんとかせな」と、助けや誘いを断っている時ほど、流れが細くなります。", "nami": "次に誰かが「手伝おうか」「一緒にやらへん？」と言ってくれたら、「ありがとう♡」で受け取ってみて。"}, "G": {"emoji": "🦋", "name": "脱皮ジャンプ", "codePhrase": "役目を終えたものを整理して次へ進む", "main": "今の自分に合うものを選び直し、次の余白をつくる力。過去の卒業や終了が、新しい行動につながった経験が手がかりです。", "sign": "以前好きだったこととの距離が変わる。", "condition": "関心の変化は、休息や環境も含めて眺めると選び直す材料になります。", "action": "役目を終えたと感じる予定を一つ書き出して、減らすか休むところから試してみて。", "boostAction": "役目を終えた予定を整理して余白をつくる", "headline": "余白をつくって、次へ進む人", "hosoku": "振り返ると、あなたが次へ進めた時は、いつも何かを終わらせたあとでした。手放してできた余白に、新しいものが入ってきています。", "tomaru": "「もう違う」とわかっている // No dependencies. Answers: {q01: "q01_A", ...}; pass the corresponding JSON config.
function evaluate(config, answers) {
  if (!config || !Array.isArray(config.questions) || !answers || typeof answers !== 'object' || Array.isArray(answers)) throw new Error('INVALID_INPUT');
  const known = new Set(config.questions.map(q => q.id));
  for (const key of Object.keys(answers)) if (!known.has(key)) throw new Error('UNKNOWN_QUESTION:' + key);
  const keys = Object.keys(config.types), zero = () => Object.fromEntries(keys.map(k => [k,0]));
  const counts = zero(), opportunities = zero(), early = zero(), earlyOpportunities = zero(), sums = zero(), answered = zero();
  const first = Object.fromEntries(keys.map(k => [k,Infinity]));
  const use = {}; let reflection = null, evidence = 0, scaleMode = false;
  config.questions.forEach((q,i) => {
    const a = q.options.find(o => o.id === answers[q.id]);
    if (!a) throw new Error('MISSING_OR_INVALID_ANSWER:' + q.id);
    if (q.kind === 'choice') {
      for (const o of q.options) if (o.type) {opportunities[o.type]++; if (i < 7) earlyOpportunities[o.type]++;}
      if (a.type) {counts[a.type]++; evidence++; first[a.type] = Math.min(first[a.type],i); if (i < 7) early[a.type]++;}
    } else if (q.kind === 'scale') {
      scaleMode = true;
      if (a.value !== null) {sums[q.type] += a.value; answered[q.type]++; evidence++; if (a.value > 0) first[q.type] = Math.min(first[q.type],i);}
    } else if (q.kind === 'rating') use[q.type] = a.value;
    else if (q.kind === 'reflection') reflection = a.value;
  });
  // スケール型：「まだ分からない」は0点と分け、回答した問いの平均で比べる
  const avg = Object.fromEntries(keys.map(k => [k, answered[k] ? sums[k]/answered[k] : null]));
  const ratioCompare = (a,b,n,d) => n[b]*d[a]-n[a]*d[b];
  const order = scaleMode
    ? (a,b) => (avg[b]-avg[a]) || (sums[b]-sums[a]) || first[a]-first[b] || a.localeCompare(b)
    : (a,b) => ratioCompare(a,b,counts,opportunities) || (config.id === 'flight' ? ratioCompare(a,b,early,earlyOpportunities) : 0) || first[a]-first[b] || a.localeCompare(b);
  const ranked = keys.filter(k => scaleMode ? answered[k] >= 2 && avg[k] > 0 : counts[k] > 0).sort(order);
  const scores = Object.fromEntries(keys.map(k => [k, scaleMode ? {
    selected:sums[k], opportunities:answered[k]*3, average:avg[k], answeredItems:answered[k], provisional:answered[k]<2,
    selectionIndex: answered[k] < 2 ? null : Math.round(100*avg[k]/3),
    ...(config.id === 'bloom' ? {useRating:use[k] ?? null, currentUsePercent: use[k] == null ? null : Math.round(use[k]*100/3)} : {})
  } : {selected:counts[k],opportunities:opportunities[k],selectionIndex:Math.round(100*counts[k]/opportunities[k])}]));
  const result = {unresolvedTypes:scaleMode?keys.filter(k=>answered[k]<2):[],diagnosis:config.id,version:config.version,evidenceCount:evidence,scores,ranked,reflection,
    status:(evidence < config.minimumEvidence || !ranked.length) ? 'insufficient_evidence' : 'complete',main:null,sub:null,
    pairKey:null,primaryTied:[],state:null,mainSelection:null};
  if (result.status !== 'complete') return result;
  let main = ranked[0];
  if (config.id === 'bloom') {
    // 運用上の優先：関心が高く（平均1.5以上）、最近あまり使っていない方向を「注目したい原石」にする。才能の量の測定ではない。
    const pr = k => avg[k]*(3-use[k]);
    const candidates = ranked.filter(k => avg[k] >= 1.5 && use[k] != null && use[k] <= 1);
    candidates.sort((a,b) => pr(b)-pr(a) || order(a,b));
    main = candidates[0] || main;
    result.mainSelection = candidates.length ? 'underused_high_interest' : 'strongest_interest';
    result.state = use[main] == null ? 'exploring' : avg[main] >= 1.5 ? ['sleeping','sleeping','opening','blooming'][use[main]] : use[main] >= 2 ? 'currently_used' : 'exploring';
    result.primaryTied = candidates.length ? candidates.filter(k => pr(k) === pr(main) && avg[k] === avg[main]) : ranked.filter(k => avg[k] === avg[main]);
  } else result.primaryTied = scaleMode ? ranked.filter(k => avg[k] === avg[main]) : ranked.filter(k => counts[k]*opportunities[main] === counts[main]*opportunities[k]);
  result.main = main; result.sub = ranked.find(k => k !== main) || null;
  result.pairKey = result.sub ? main+'_'+result.sub : null;
  return result;
}

function pairInfo(k,main,sub){if(!main||!sub)return null;const key=[main,sub].sort().join('');const p=PAIRS[k][key];if(!p)return null;const T=DATA[k].types;return {lead:PAIR_LEAD[k]('「'+T[main].headline+'」','「'+T[sub].headline+'」'),s:p.s,t:p.t}}

 const tc=DATA.charm.types[c.main],tb=DATA.bloom.types[b.main],tf=DATA.flight.types[f.main];
 const line=`${CODE_CHARM[c.main]}、${tb.headline.replace(/人$/,'')}原石をひらき、${CODE_FLIGHT[f.main]}。`;
 const BW={sleeping:'まだあなたの中で、開くのを待っています',opening:'今まさに、開きかけています',blooming:'もう咲きはじめています',currently_used:'もう咲きはじめています',exploring:'これから育っていくところです'};
 const story=`あなたは「${tc.headline}」。そして「${tb.headline}」になれる力が、${BW[b.state]||'これから育っていくところです'}。現実を動かすのは、「${tf.headline}」としてのあなたの飛び方。3つとも、外から足したものじゃなく、あなたが元々持ってたものです。`;

function save(){if(optIn){try{localStorage.setItem('meguru-diagnostics-v2',JSON.stringify({schema:2,records}));}catch{status('この端末への保存ができませんでした。画面内の結果はそのまま使えます。')}}}

function load(){try{const s=JSON.parse(localStorage.getItem('meguru-diagnostics-v2'));if(s?.schema!==2)return;let valid={};for(const k of ORDER){const r=s.records?.[k];if(!r||r.version!==DATA[k].version)continue;if(r.draft){if(Number.isInteger(r.index)&&r.index>=0&&r.index<DATA[k].questions.length&&r.order&&DATA[k].questions.every(q=>Array.isArray(r.order[q.id])&&r.order[q.id].length===q.options.length&&new Set(r.order[q.id]).size===q.options.length&&r.order[q.id].every(x=>q.options.some(o=>o.id===x))))valid[k]=r;}else{try{valid[k]={...r,result:evaluate(DATA[k],r.answers)}}catch{}}}records=valid;optIn=true;}catch{}}
function footer(){return `<div class="storage"><label><input id="opt-in" type="checkbox" ${optIn?'checked':''}>この端末に回答と結果を保存する（3つの診断をまとめて見るため）</label><p class="small">共有端末では保存先を確かめてください。回答を送信する処理はありません。</p>${optIn?'<button class="text-btn" data-action="erase">保存した回答を削除する</button>':''}</div><p id="status" role="status" class="small muted"></p><div class="footer">元々、持ってた。｜ぼたん・めぐる</div>`}
function intro(){const d=DATA[id],n=ORDER.indexOf(id);return `<div class="center"><div class="eyebrow">${ICONS[id]} ${LABEL[id]}</div>${jewel()}<div class="eyebrow">${esc(d.title)}</div><h1>${id==='charm'?'自分では普通。<br>そこに、あなたの<br>魅力がある。':esc(d.catch)}</h1><div class="ornament">✦</div><p class="muted">${esc(d.description)}</p><p class="small muted">全${d.questions.length}問</p><button class="primary" data-action="start">${records[id]?.draft?'続きから進む':id==='charm'?'私の魅力を、ひらく♡':id==='bloom'?'私の原石を、見つける♡':'私の飛び方を、見つける♡'}</button><p class="small muted">${id==='flight'?'実際の経験に一番近いものを一つ選びます。同じ経験を思い浮かべて、何問答えても大丈夫です。':'思い当たる場面が浮かばない時は「まだ分からない」を選べます。複数の質問に同じ点数をつけて大丈夫です。'}</p>${records[id]&&!records[id].draft?'<button class="secondary" data-action="result">前回の結果を見る</button>':''}</div>`}
function quiz(){const d=DATA[id],q=d.questions[index],opts=order[q.id].map(k=>q.options.find(o=>o.id===k));const part=id==='bloom'?(index<14?'PART 1｜これから広がる可能性':index<21?'PART 2｜今の暮らしで、どれくらい使っている？':'最後の振り返り'):id==='flight'?'実際の経験を思い浮かべて':'いつもの自分を思い浮かべて';return `<div class="eyebrow">${esc(d.title)}　${index+1} / ${d.questions.length}</div><div class="progress"><span style="width:${index/d.questions.length*100}%"></span></div><div class="card question"><div class="eyebrow">${part}</div><h2>${esc(q.text)}</h2></div>${opts.map(o=>`<button class="option ${answers[q.id]===o.id?'selected':''} ${(q.kind==='choice'&&!o.type)||o.value===null?'none':''}" data-answer="${o.id}" aria-pressed="${answers[q.id]===o.id}"><i aria-hidden="true"></i><span>${esc(o.text)}</span></button>`).join('')}<div class="qnav"><button data-action="back">← ${index?'前の質問':'説明に戻る'}</button><span class="small muted">選ぶと次へ進みます</span></div>`}
function section(title,body){return `<section class="card"><h3>${esc(title)}</h3><p>${esc(body)}</p></section>`}
function nextButtons(){const others=ORDER.filter(x=>x!==ONLY);const done=x=>records[x]&&!records[x].draft;const all=ORDER.every(done);return `${all?'<button class="primary" data-action="summary">3つをつないだ、私の総合カードを見る</button>':''}<section class="card others"><div class="eyebrow">ほかの診断もやってみる？</div>${others.map(x=>`<a class="secondary" href="./${PAGE[x]}">${ICONS[x]} ${esc(DATA[x].title)}${done(x)?'（結果を見る）':''}<br><span class="small">${esc(DATA[x].catch)}</span></a>`).join('')}<p class="small muted">3つそろうと、あなただけの総合カード「MY BLOOM CODE」が見られます。</p></section>`}
function session(){return `<section class="card session"><div class="eyebrow">もっと深めたい人へ</div><h2>あなただけの答えは、<br>ぼたんと一緒に。</h2><p>この診断は、たくさんの人に共通する質問から出した「一般的な地図」。しっくりきたところも、違和感があったところも材料に、あなただけの魅力と力の使い道を一緒に見つけるのが、ぼたんとの個別セッションです。</p><p class="small muted">3つの診断を終えると、セッションで得られることを詳しくご案内しています。先に聞いてみたい方は、公式LINEからどうぞ。</p><a class="secondary" target="_blank" rel="noopener noreferrer" href="${esc(SETTINGS.lineUrl)}">公式LINEで、ぼたんに聞いてみる</a></section>`}
function result(){const d=DATA[id],r=records[id].result;if(r.status!=='complete')return `<div class="center">${jewel()}<h2>今は、思い浮かぶ<br>手がかりから。</h2><p>今回の回答では、方向を選ぶ材料が少なめでした。これは魅力や力の大きさを表すものではありません。</p><p>好きなものや気になった経験を、そのまま持ち帰ってみて。</p></div>${honne()}${nextButtons()}<button class="text-btn" data-action="redo">もう一度受ける</button>${note(d)}`;
const t=d.types[r.main],s=r.sub?d.types[r.sub]:null,comb=s?d.pairs[r.pairKey]:null;const title=comb?.title||t.emoji+t.name;
let body=`<div class="sharecard" id="result-card"><div class="eyebrow">${esc(d.title)} / ${LABEL[id]}</div>${jewel()}<div class="small muted">${esc(d.mainLabel)}</div><h2>${esc(t.headline)}</h2><p class="serif type-names">${esc(t.emoji+t.name+(s?' × '+s.emoji+s.name:''))}</p><p class="small muted">今回の回答からの手がかり｜元々、持ってた。</p></div>`;
if(id==='bloom'){const sc=r.scores[r.main];body+=`<div class="card"><div class="metrics"><div class="metric"><strong>${sc.selectionIndex}<small style="font-size:14px"> / 100</small></strong><span>原石への関心指数<br>${sc.opportunities/3}問の回答から</span></div><div class="metric"><strong style="font-size:22px">${esc(useLabel(sc.useRating))}</strong><span>今の暮らしでの活用度<br>${sc.currentUsePercent==null?'':sc.currentUsePercent+'％（自己回答の換算）'}</span></div></div><span class="badge">${esc(stateNames[r.state])}</span><p>${esc({sleeping:'繰り返し気になるけれど、今は使う機会が少なかった方向。小さく試してみたい原石です。',opening:'今、使う機会がある方向。どんな場面で楽しめるかを確かめてみて。',blooming:'今、よく使っている方向。これからも楽しめる使い方を選んでみて。',currently_used:'今、使う機会がある力。本人の経験を手がかりに、使い方を振り返ってみて。',exploring:'今回関心を向けた方向。小さく試しながら、しっくりくるか確かめてみて。'}[r.state])}</p><p class="small muted">関心指数は前半の回答の平均、活用度は後半の「今の暮らしでどれくらい使っているか」を換算した値です。才能の量や、才能全体の何％が開いたかを表す数字ではありません。</p></div>`}
if(id==='bloom')body+=`<section class="card"><h3>今のあなたへ</h3><p>${esc(REFLECT_MSG[r.reflection==null?'u':r.reflection])}</p></section>`;if(r.unresolvedTypes?.length)body+=`<p class="notice">まだ分からないところもあります。${esc(r.unresolvedTypes.map(k=>'「'+d.types[k].headline+'」').join('・'))}は回答が少ないため、順位をつけていません。</p>`;if(r.primaryTied.length>1)body+=`<p class="notice">同じ得点の方向：${esc(r.primaryTied.map(k=>'「'+d.types[k].headline+'」').join('・'))}。その重なりも、あなたらしさです。</p>`;
if(id==='flight'&&s&&r.scores[r.sub].selected===1)body+=`<p class="notice">組み合わせの相手は1回答からの候補です。経験に合うか、確かめてみて。</p>`;
const sections=id==='charm'?[['こんなこと、ありませんか？','__ARU__'],['その正体',t.shotai],['周りからは、こう見えてる',t.seen],['無意識に使ってる時間',t.time],['二つの魅力が重なると','__PAIR__'],['楽しむ一手',t.action]]:id==='bloom'?[['「短所かも」と思ってたこと',t.tanso],['実は、それが原石',t.jitsuwa],['ひらいたら、こうなる',t.hiraku],['今まで眠ってた理由',t.nemutta],['一緒に使う原石','__PAIR__'],['今日の一手',t.action]]:[['あなたの飛び方の法則',t.hosoku],['流れが止まる時のサイン',t.tomaru],['次に波が来たら',t.nami],['飛躍を加速させる力','__PAIR__'],['今日の一手',t.action]];
body+=sections.filter(x=>x[1]).map(x=>x[1]==='__PAIR__'?pairSection(x[0],id,r.main,r.sub):x[1]==='__ARU__'?`<section class="card aru"><h3>${esc(x[0])}</h3><ul>${t.aruaru.map(a=>`<li>${esc(a)}</li>`).join('')}</ul><p class="small muted">ひとつでも思い当たったら、それがあなたの魅力の入口です。</p></section>`:section(...x)).join('');if(id==='bloom')body+=`<details class="card"><summary>7つの原石の関心と活用を見る</summary><p class="small muted">上段：関心指数／下段：今の暮らしでの活用</p>${Object.entries(d.types).map(([k,x])=>`<div class="barrow"><span class="bar-name">${esc(x.headline)}</span><div><div class="bar"><span style="width:${r.scores[k].selectionIndex??0}%"></span></div><div class="bar" style="margin-top:5px"><span style="width:${r.scores[k].currentUsePercent??0}%;background:#d0b56e"></span></div></div><span>${r.scores[k].selectionIndex??'–'}<br>${r.scores[k].currentUsePercent??'–'}</span></div>`).join('')}</details>`;
return body+`<button class="secondary" data-action="download-card">結果カードを画像で保存する</button>`+askCard(id)+honne()+nextButtons()+`<button class="text-btn" data-action="redo">もう一度受ける</button>`+note(d)}
function summaryData(){return ORDER.map(k=>{const r=records[k]?.result,d=DATA[k];return {id:k,title:d.title,main:r?.main?d.types[r.main]:null,sub:r?.sub?d.types[r.sub]:null}})}
function summary(){const lines=summaryData(),code=bloomCode();const text=code?code.story:lines.map(x=>x.main?`${x.title}では「${x.main.codePhrase}」方向が表れました。`:`${x.title}は、これから探る方向です。`).join('');return `<div class="center"><div class="eyebrow">知る・開く・飛ぶ</div><h1>私の可能性の<br>見取り図。</h1></div><div class="sharecard" id="result-card"><div class="eyebrow">MEGURU</div>${jewel()}<h2>MY BLOOM CODE</h2>${code?`<p class="code-line serif">${esc(code.line)}</p>`:''}${lines.map(x=>`<div class="summary-row">${x.main?`<img class="summary-art" src="${resultArt(x.id,records[x.id].result.main)}" alt="${esc(x.main.name)}のビジュアル">`:""}<span>${ICONS[x.id]} ${esc(x.title)}</span><b>${esc(x.main?x.main.headline:'これから探る方向')}</b>${x.main?`<small class="summary-sub">${esc(x.main.name+(x.sub?' × '+x.sub.name:''))}</small>`:''}</div>`).join('')}<p class="code-story">${esc(text)}</p><p class="small muted">今回の回答からの手がかり｜ぼたん・めぐる</p></div><button class="secondary" data-action="download-card">総合カードを画像で保存する</button>${honne()}<div class="card"><h3>結果をもう一度見る</h3>${ORDER.map(k=>`<button class="secondary" data-review="${k}">${esc(DATA[k].title)}</button>`).join('')}</div>`}
function finish(){return `<div class="center">${jewel()}<h2>今日見つけたものを、<br>日常へ。</h2><p>好きなところも、気になったところも。あなたを知る手がかりとして、持ち帰ってみて。</p></div>${honne()}<button class="secondary" data-action="result">今回の結果を見る</button>${nextButtons().replace('<button class="text-btn" data-action="finish">今日は、この結果を持ち帰る♡</button>','')}`}
function render(){const d=DATA[id];app.innerHTML=header()+(screen==='intro'?intro():screen==='quiz'?quiz():screen==='summary'?summary():screen==='finish'?finish():result())+footer();const ta=document.getElementById('honne-text');if(ta)ta.oninput=e=>{honneText=e.target.value;const l=document.getElementById('send-line');if(l)l.href=lineHref()};document.getElementById('opt-in').onchange=e=>{optIn=e.target.checked;if(optIn)save();else{try{localStorage.removeItem('meguru-diagnostics-v2')}catch{}}render()}}
app.addEventListener('click',e=>{const sl=e.target.closest('#send-line');if(sl){const msg=lineMessage();try{navigator.clipboard?.writeText(msg).then(()=>{const c=document.getElementById('copy-status');if(c)c.textContent='コピーしました。LINEのトークに貼り付けて送ってね♡'},()=>{})}catch{}return}const b=e.target.closest('button');if(!b)return;if(b.dataset.starter){const s=STARTERS[+b.dataset.starter][1];const ta=document.getElementById('honne-text');honneText=s;if(ta){ta.value=s;ta.focus();ta.setSelectionRange(s.length,s.length)}const l=document.getElementById('send-line');if(l)l.href=lineHref();return}const a=b.dataset.action;if(b.dataset.answer){const q=DATA[id].questions[index];answers[q.id]=b.dataset.answer;if(index+1<DATA[id].questions.length){index++;records[id]={draft:true,version:DATA[id].version,answers:{...answers},index,order};save();change('quiz')}else{const result=evaluate(DATA[id],answers);records[id]={draft:false,version:DATA[id].version,answers:{...answers},result};save();change('result')}return}if(b.dataset.next){id=b.dataset.next;change('intro');return}if(b.dataset.review){id=b.dataset.review;change('result');return}if(a==='start'){start(id)}else if(a==='home'){id=ONLY;change('intro')}else if(a==='back'){if(index){index--;records[id]={draft:true,version:DATA[id].version,answers:{...answers},index,order};save();change('quiz')}else change('intro')}else if(a==='result')change('result');else if(a==='finish')change('finish');else if(a==='summary')change('summary');else if(a==='redo'){if(!confirm('もう一度回答しますか？この診断の前回の結果を置き換えます。'))return;delete records[id];save();start(id)}else if(a==='erase'){try{localStorage.removeItem('meguru-diagnostics-v2')}catch{}optIn=false;render();status('この端末に保存した回答を削除しました。今開いている結果は画面内に残っています。')}else if(a==='download-card')downloadCard()});
function wrapText(ctx,text,width){let line='',out=[];for(const ch of text){if(ctx.measureText(line+ch).width>width){out.push(line);line=ch}else line+=ch}if(line)out.push(line);return out}
async function downloadCard(){if(screen!=='summary')return downloadTypeCard();const cv=document.createElement('canvas');cv.width=1080;cv.height=1350;const ctx=cv.getContext('2d');const grad=ctx.createLinearGradient(0,0,1080,1350);grad.addColorStop(0,'#fff');grad.addColorStop(1,'#f6e6f5');ctx.fillStyle=grad;ctx.fillRect(0,0,1080,1350);ctx.strokeStyle='#c9b071';ctx.lineWidth=3;ctx.strokeRect(42,42,996,1266);ctx.textAlign='center';ctx.fillStyle='#ad82b5';ctx.font='24px sans-serif';ctx.fillText('MEGURU  /  元々、持ってた。',540,110);try{const hero=new Image();hero.src=resultArt(id,screen==='summary'?null:records[id]?.result?.main);await new Promise((resolve,reject)=>{hero.onload=resolve;hero.onerror=reject});ctx.save();ctx.beginPath();ctx.roundRect(335,135,410,155,14);ctx.clip();const sw=hero.naturalWidth,sh=sw/(410/155),sy=(hero.naturalHeight-sh)*.54;ctx.drawImage(hero,0,sy,sw,sh,335,135,410,155);ctx.restore();}catch{ctx.font='82px serif';ctx.fillText('◇',540,245);}ctx.fillStyle='#493456';let title,blocks=[];if(screen==='summary'){title='MY BLOOM CODE';const code=bloomCode();blocks=(code?[{label:'あなたの一文',text:code.line}]:[]).concat(summaryData().map(x=>({label:x.title,image:x.main?resultArt(x.id,records[x.id].result.main):null,text:x.main?x.main.headline+'（'+x.main.name+(x.sub?' × '+x.sub.name:'')+'）':'これから探る方向'})))}else{const r=records[id].result,d=DATA[id];title=d.title;const t=d.types[r.main],s=r.sub?d.types[r.sub]:null;if(!t){status('タイプが出ている結果画面で保存してください。');return}blocks=[{label:'今の回答に表れた方向',text:t.headline+'（'+t.name+(s?' × '+s.name:'')+'）'},{label:'あなたらしさのひとこと',text:t.codePhrase},{label:'今日の一手',text:t.action}];if(id==='bloom')blocks[1]={label:'関心指数 / 今の暮らしでの活用',text:r.scores[r.main].selectionIndex+' / 100　・　'+(r.scores[r.main].currentUsePercent==null?'まだ分からない':r.scores[r.main].currentUsePercent+'％（今の暮らしでの活用度）')}}ctx.font='52px serif';ctx.fillText(title,540,358);let y=425;for(const b of blocks){if(b.image){try{const thumb=new Image();thumb.src=b.image;await new Promise((resolve,reject)=>{thumb.onload=resolve;thumb.onerror=reject});ctx.save();ctx.beginPath();ctx.roundRect(110,y-8,125,110,12);ctx.clip();const sw=thumb.naturalWidth,sh=sw/(125/110),sy=Math.max(0,(thumb.naturalHeight-sh)/2);ctx.drawImage(thumb,0,sy,sw,sh,110,y-8,125,110);ctx.restore();}catch{}}ctx.fillStyle='#b485bb';ctx.font='24px sans-serif';ctx.fillText(b.label,540,y);y+=53;ctx.fillStyle='#493456';ctx.font=screen==='summary'?'36px serif':'34px serif';for(const l of wrapText(ctx,b.text,870)){ctx.fillText(l,540,y);y+=49}y+=58}ctx.fillStyle='#796987';ctx.font='23px sans-serif';ctx.fillText('今回の回答からの手がかり｜ぼたん・めぐる',540,1210);ctx.font='19px sans-serif';ctx.fillText('能力や将来の成果を測定するものではありません。',540,1250);cv.toBlob(async blob=>{if(!blob){status('画像を作成できませんでした。スクリーンショットも使えます。');return}const file=new File([blob],'meguru-result.png',{type:'image/png'});try{if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'めぐる診断'});return}}catch(e){if(e.name==='AbortError')return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='meguru-result.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);status('画像を作成しました。保存した画像を確認してください。')},'image/png')}

function useLabel(v){return v==null?'まだ分からない':['ほぼ使っていない','たまに使う','よく使う','かなり使う'][v]}
async function downloadTypeCard(){
 const r=records[id]?.result;if(!r?.main)return;
 const t=DATA[id].types[r.main],sub=r.sub?DATA[id].types[r.sub]:null;
 const cv=document.createElement('canvas');cv.width=1080;cv.height=1920;const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,1080,1920);
 try{const im=new Image();im.src=resultArt(id,r.main);await new Promise((resolve,reject)=>{im.onload=resolve;im.onerror=reject});const scale=Math.min(1000/im.naturalWidth,1250/im.naturalHeight);const w=im.naturalWidth*scale,h=im.naturalHeight*scale;ctx.drawImage(im,(1080-w)/2,45,w,h)}catch{status('画像の読み込みができませんでした。もう一度お試しください。');return}
 ctx.textAlign='center';ctx.fillStyle='#493456';ctx.font='30px sans-serif';let y=1380;
 const lines=[DATA[id].title+'｜'+t.headline+'（'+t.name+(sub?' × '+sub.name:'')+'）',...(id==='bloom'?['今の暮らしでの活用：'+useLabel(r.scores[r.main].useRating)]:[]),'今日の一手：'+t.action];
 for(const text of lines){for(const line of wrapText(ctx,text,900)){ctx.fillText(line,540,y);y+=43}y+=24}
 ctx.fillStyle='#796987';ctx.font='24px sans-serif';ctx.fillText('今回の回答からの手がかり｜ぼたん・めぐる',540,1830);
 cv.toBlob(async blob=>{if(!blob)return;const file=new File([blob],'meguru-'+id+'-result.png',{type:'image/png'});try{if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'めぐる診断'});return}}catch(e){if(e.name==='AbortError')return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);status('結果画像を作成しました。')},'image/png');
}

load();id=ONLY;render();
fetch('./my-bloom-code-img.html').then(r=>r.text()).then(t=>{const m=t.match(/<script type="application\/json" id="img-data">([\s\S]*?)<\/script>/);if(m){IMG=JSON.parse(m[1]);const ta=document.getElementById('honne-text');const keep=ta?ta.value:null;render();if(keep!==null){const t2=document.getElementById('honne-text');if(t2)t2.value=keep}}}).catch(()=>{});
</script></body></html>
