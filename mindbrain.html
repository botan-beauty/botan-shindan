<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>マインドブレイン診断（何族？）🌙</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:linear-gradient(165deg,#0d0520 0%,#1e0f3e 30%,#381a60 60%,#170733 100%);font-family:"Hiragino Maru Gothic Pro","BIZ UDPGothic","Yu Gothic",sans-serif;display:flex;align-items:flex-start;justify-content:center;padding:16px;position:relative;overflow-x:hidden}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;border-radius:50%;background:#fff;animation:tw var(--d) ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.8}}
#app{width:100%;max-width:440px;z-index:1;transition:opacity .3s,transform .3s}
#app.fade{opacity:0;transform:translateY(10px)}
.card{background:rgba(255,255,255,.975);border-radius:26px;padding:26px 22px;box-shadow:0 24px 70px rgba(0,0,0,.5)}

/* 妖精 */
.fairy{position:absolute;pointer-events:none;z-index:5;opacity:.92;filter:drop-shadow(0 4px 10px rgba(140,80,200,.22))}
@keyframes fly1{
 0%   {transform:translate(0,0) rotate(-4deg)}
 20%  {transform:translate(-9px,-16px) rotate(3deg)}
 45%  {transform:translate(6px,-26px) rotate(6deg)}
 70%  {transform:translate(11px,-11px) rotate(-2deg)}
 100% {transform:translate(0,0) rotate(-4deg)}
}
@keyframes fly2{
 0%   {transform:translate(0,0) rotate(3deg) scale(1)}
 30%  {transform:translate(13px,-19px) rotate(-5deg) scale(1.07)}
 55%  {transform:translate(-8px,-30px) rotate(4deg) scale(.96)}
 80%  {transform:translate(-4px,-8px) rotate(-2deg) scale(1.03)}
 100% {transform:translate(0,0) rotate(3deg) scale(1)}
}
@keyframes fly3{
 0%   {transform:translate(0,0) rotate(0deg)}
 25%  {transform:translate(16px,-9px) rotate(7deg)}
 50%  {transform:translate(4px,-24px) rotate(-4deg)}
 75%  {transform:translate(-12px,-13px) rotate(5deg)}
 100% {transform:translate(0,0) rotate(0deg)}
}
.fairy img{width:100%;height:auto;display:block}
.wrap-rel{position:relative}
/* 地図の吹き出し横に置く案内妖精 */
.map-fairy{position:absolute;width:38px;left:5%;bottom:8%;z-index:3;pointer-events:none;filter:drop-shadow(0 3px 8px rgba(120,70,180,.28))}
.map-fairy img{width:100%;display:block;animation:fly2 6s ease-in-out infinite}

/* 表紙 */
.brand{text-align:center;margin-bottom:14px}
.brand-sub{color:#a888d0;font-size:.68rem;letter-spacing:.18em;margin-bottom:6px}
h1{font-size:1.72rem;font-weight:800;color:#2a1050;line-height:1.25;text-align:center}
h1 span{color:#7a32c0}
.h1-en{color:#b89ad8;font-size:.66rem;letter-spacing:.22em;text-align:center;margin-top:4px;margin-bottom:16px}
.mapbox{border-radius:18px;margin-bottom:18px;border:2px solid #e2d0f6;box-shadow:0 8px 24px rgba(90,40,150,.18);position:relative}
.mapbox img{width:100%;display:block;border-radius:16px}
.intro{background:linear-gradient(140deg,#faf4ff,#fff2fa);border-radius:18px;padding:18px 18px;margin-bottom:20px;border:1.5px solid #ead9fa}
.intro p{color:#5f4090;font-size:.85rem;line-height:2.05;margin-bottom:13px}
.intro p:last-child{margin-bottom:0}
.intro .big{font-size:.95rem;font-weight:800;color:#6b2fae}
.btn-main{width:100%;background:linear-gradient(135deg,#5320a0,#8c3fd0);color:#fff;border:none;border-radius:50px;padding:17px;font-size:1.05rem;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 8px 26px rgba(85,30,160,.45);transition:transform .18s}
.btn-main:active{transform:scale(.97)}
.hint-note{color:#b0a0c4;font-size:.7rem;text-align:center;margin-top:12px}

/* 質問 */
.bar-track{height:7px;background:#ece0f8;border-radius:5px;margin-bottom:20px;overflow:hidden}
.bar-prog{height:100%;background:linear-gradient(90deg,#7a32c0,#b070e8);border-radius:5px;transition:width .35s ease}
.q-num{color:#b49ad0;font-size:.72rem;text-align:center;margin-bottom:10px;letter-spacing:.08em}
.q-text{font-size:1.16rem;font-weight:800;color:#1d0740;line-height:1.6;text-align:center;margin-bottom:22px;min-height:3.2em;display:flex;align-items:center;justify-content:center}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{background:linear-gradient(135deg,#fbf9ff,#f5eefd);border:2px solid #e6d8f8;border-radius:15px;padding:15px;text-align:center;font-size:.96rem;color:#3a1860;cursor:pointer;font-family:inherit;font-weight:700;transition:all .18s}
.opt:active{background:linear-gradient(135deg,#eadcff,#e2d0ff);border-color:#a878e8;transform:scale(.98)}

/* 計算中 */
.calc{font-size:46px;display:block;text-align:center;margin-bottom:14px;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 結果 */
.r-head{text-align:center;margin-bottom:18px}
.r-title{font-size:1.14rem;font-weight:800;color:#1d0740;line-height:1.45}
.r-sub{color:#8f6bb8;font-size:.76rem;margin-top:6px;line-height:1.7}
.top-card{border-radius:20px;padding:16px 14px;margin-bottom:11px;position:relative;overflow:hidden}
.top-badge{position:absolute;top:9px;right:9px;color:#fff;font-size:.66rem;padding:4px 11px;border-radius:11px;font-weight:800;z-index:2}
.tribe-img{width:100%;border-radius:14px;overflow:hidden;margin-bottom:11px;background:#fff}
.tribe-img img{width:100%;display:block}
.tribe-name{font-weight:800;font-size:1.12rem;margin-bottom:2px}
.tribe-catch{color:#9a88b4;font-size:.71rem;font-style:italic;margin-bottom:9px}
.bar-wrap{background:#ece4f4;border-radius:4px;height:7px;margin-bottom:4px}
.bar-fill{height:100%;border-radius:4px;transition:width .6s ease}
.bar-status{color:#9a88b4;font-size:.67rem;margin-bottom:10px}
.why-line{font-size:.81rem;font-weight:700;border-radius:12px;padding:11px 13px;line-height:1.75;margin-bottom:9px;background:rgba(255,255,255,.72)}
.btn-detail{width:100%;background:rgba(255,255,255,.9);border:1.5px dashed;border-radius:12px;padding:11px;font-size:.83rem;font-weight:800;cursor:pointer;font-family:inherit;transition:all .18s}
.btn-detail:active{transform:scale(.98)}

.rest-label{color:#8f6bb8;font-size:.74rem;font-weight:700;margin-bottom:8px;margin-top:4px}
.rest-card{border-radius:15px;padding:12px;margin-bottom:9px}
.rest-top{display:flex;align-items:center;gap:11px;margin-bottom:8px}
.rest-thumb{width:62px;height:70px;border-radius:10px;overflow:hidden;flex-shrink:0;background:#fff}
.rest-thumb img{width:100%;height:100%;object-fit:cover;object-position:center 22%}
.rest-name{font-weight:800;font-size:.92rem}
.rest-pct{font-size:.8rem;font-weight:800}
.rest-why{font-size:.75rem;line-height:1.7;margin-bottom:8px;opacity:.94}

/* 詳しく */
.detail-box{display:none;margin-top:10px;border-radius:16px;padding:15px;background:rgba(255,255,255,.95)}
.detail-box.open{display:block;animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.d-img{width:100%;border-radius:13px;overflow:hidden;margin-bottom:13px}
.d-img img{width:100%;display:block}
.d-tag{font-size:.78rem;font-style:italic;text-align:center;margin-bottom:13px;opacity:.75}
.d-sec{margin-bottom:13px}
.d-h{font-size:.83rem;font-weight:800;margin-bottom:5px}
.d-p{font-size:.79rem;line-height:1.95;color:#4d3868}
.d-list{list-style:none;padding:0}
.d-list li{font-size:.79rem;line-height:1.9;color:#4d3868;padding-left:15px;position:relative}
.d-list li:before{content:"・";position:absolute;left:0}
.d-nou{border-radius:12px;padding:12px;font-size:.79rem;line-height:1.95;background:linear-gradient(135deg,#f6efff,#fff0fa);border:1.5px solid #e4d2f6;color:#5a3f8c}
.d-close{width:100%;background:none;border:none;color:#a892c0;font-size:.76rem;cursor:pointer;font-family:inherit;margin-top:10px;text-decoration:underline}

/* 締め */
.botan-msg{background:linear-gradient(140deg,#f3ebff,#ffeaf8);border-radius:18px;padding:16px;margin:18px 0;border:2px solid #ddbcf2}
.botan-head{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.botan-face{width:42px;height:42px;border-radius:50%;overflow:hidden;border:2px solid #c99ae8;flex-shrink:0;background:#f6eeff;display:flex;align-items:center;justify-content:center;font-size:20px}
.botan-face img{width:100%;height:100%;object-fit:cover}
.botan-from{color:#6a34a6;font-size:.79rem;font-weight:800}
.msg-text{color:#5f4090;font-size:.8rem;line-height:1.95}
.msg-text b{color:#7a32c0}
.msg-q{color:#8c3fd0;font-size:.92rem;font-weight:800;text-align:center;margin:12px 0;letter-spacing:.02em}
.msg-ok{color:#6a34a6;font-size:.81rem;line-height:1.9;text-align:center;margin-top:10px}

.btn-line{width:100%;background:linear-gradient(135deg,#06c755,#00a040);color:#fff;border:none;border-radius:50px;padding:16px;font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 6px 20px rgba(6,199,85,.35);text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:9px}
.btn-share{width:100%;background:linear-gradient(135deg,#c03878,#e06090);color:#fff;border:none;border-radius:50px;padding:14px;font-size:.94rem;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 6px 18px rgba(180,40,100,.3);margin-bottom:9px}
.btn-retry{width:100%;background:rgba(255,255,255,.1);color:#d4c4f0;border:1.5px solid rgba(200,180,255,.28);border-radius:50px;padding:13px;font-size:.88rem;font-weight:700;cursor:pointer;font-family:inherit}
.ss-box{background:#fff8fc;border:1.5px solid #f2c6dc;border-radius:15px;padding:14px;margin-bottom:9px;font-size:.77rem;color:#5a3050;line-height:1.9;display:none}
.ss-box.open{display:block}
.ss-close{background:none;border:none;color:#a080b0;font-size:.74rem;cursor:pointer;font-family:inherit;margin-top:6px;text-decoration:underline}
.hash{color:#9060a0;font-weight:700}
</style>
</head>

{id:"kangae",name:"考えすぎ族",emoji:"🌀",color:"#9a7830",bg:"#fdf8ec",border:"#d8b868",catch:"まだ起きてないことまで考える。",status:"本日：脳内会議24時間目、続行中🌀",

];

/* ===== 詳しく（こんな人／あるある／強み／脳の話） ===== */
var DETAIL = {
zubora:{person:"やらなあかんことほど、後回し。「あとで〜あとで〜」が口ぐせで、気づいたら一日終わってる🤣 でも興味あることには異常な集中力を発揮する。推しのこと、好きなこと、そういうのだけはスイッチ入ったら止まらへん。部屋にお菓子の袋が散らばってても、本人は全然平気。むしろそれが落ち着く。",
 aru:["掃除しよ思て、写真フォルダ2時間見てた","「明日から本気出す」の明日が来ない","やる気ない日と、神がかる日の差が激しい"],
 kyo:"みんなが「頑張らな」で消耗してる中、ズボラ族はエネルギーの使いどころを、無意識に選んでる。どうでもええことに力を使わへんから、大事な時にドンと集中できる。これ、才能やで。",
 nou:"動けへんのは、怠けてるからやない。脳が「今はエネルギー使うとこちゃうで」って、ちゃんと守ってくれてるだけ。むしろ力みが少ないぶん、巡りは戻りやすいタイプ。「ちゃんとせな」を手放したとき、いちばん自分らしく動けるんよ🌿"},
stoic:{person:"決めたことは、しんどくてもやりきる。責任感の塊で、途中で投げ出すのが一番きらい。筋肉痛はご褒美、努力してる自分がいちばんしっくりくる💪 まわりからは「すごいね」って言われるけど、本人は「まだまだ」。止まると不安になるから、気づいたらずっと走ってる。",
 aru:["休むと逆にソワソワして落ち着かへん","「頑張ってるね」に「いや全然」って返しがち","誰かが止めへんと、無限に稼働し続ける"],
 kyo:"一度決めたら本当にやりきる継続力は、なかなか真似できひん。コツコツ積み上げる力、責任を最後まで背負う覚悟。これがあるから、まわりはあなたを信頼するんよ。",
 nou:"頑張り続けられるのは、まぎれもない強さ。でもな、脳が「もう止まってええで」の合図を出しにくくなってるかもしれん。ずっとアクセル踏みっぱなしやと、いつか巡りが滞る。止まるのは負けやない、メンテナンス。緩める勇気も、あなたの強さの一部やで🌿"},
moso:{person:"頭の中では、もう成功してる🌈 理想の未来を思い描くのが大好きで、アイデアも設計図も天才級。ただ——現実で動き出すまでが、やたら長い🤣 考えてる時間がいちばん楽しいから、つい脳内で完結してまう。「いつかやりたいこと」リストが、どんどん増えていくタイプ。",
 aru:["脳内では新事業が3つくらい成功してる","準備は完璧、でもスタートボタンが押せへん","調べもの始めたら、それだけで満足しがち"],
 kyo:"あなたの\u201c描く力\u201dは飛び抜けてる。ゼロから世界を思い浮かべられる人は、そんなにおらん。動き出しさえすれば、その妄想は全部、設計図になる。夢を見る力は、叶える力の一歩手前や。",
 nou:"動き出しが遅いのは、力不足やのうて、頭の中で完璧に見えすぎるから。脳が理想を鮮明に描けるぶん、現実との差にひるんでまう。でもな、60点で始めてええんよ。妄想の一部をちょこっと現実に出すだけで、巡りは動き出す🌿"},
ai:{person:"気になり出したら、納得いくまで手を止められへん🔍 夜のほうが頭が冴えて、「修正一個だけ」のつもりが気づいたら朝💜 AIを社員みたいに使いこなして、一人で会社みたいに回してる。集中モードに入ると、時間の感覚が消える。深夜が本領発揮タイム。",

 nou:"その集中力は宝物。でも脳がずーっとオンのまま、切り替えが苦手になってるサインかもしれん。深夜まで走れるのは、脳が興奮してるから。オフにする時間をちゃんと作ると、集中はもっと冴える。休むのも、才能を活かす技術やで🌿"},
beki:{person:"「ちゃんとせなあかん」が口ぐせ🥺 責任感が強くて、人に迷惑かけたくなくて、つい自分が我慢しがち。ルールや「普通」を大事にして、きっちりしてないと落ち着かへん。頼られると断れへんし、全部自分のせいにしてしまうことも。まわりからは「しっかりしてる人」に見られてる。",

 nou:"「ちゃんと」は、あなたの優しさと責任感の証。でもな、その我慢が積もると、脳の力みになって溜まっていく。「〜べき」が多いほど、脳はずっと緊張モード。たまには「まあ、いっか」を自分に許してあげて。緩めた時、いちばん自分に還れるんよ🌿"},
meguri:{person:"理屈より「なんとなくの感覚」で選ぶ🌙 一緒にいる人や場の空気に、気分がふわっと左右される。合う人には吸い寄せられて、合わへんと身体が即・拒否🌿 頭で考えるより、身体が先に答えを知ってるタイプ。流れに委ねるのが上手で、無理に逆らわへん。",
 aru:["「なんか違う」の直感がだいたい当たる","苦手な人といると、その日ずっとしんどい","理由は説明できひんけど、選択はいつも正しい"],

function startQuiz(){scores={};qIdx=0;fade(renderQ);}

function renderQ(){
var q=QUESTIONS[qIdx];
var pct=Math.round(qIdx/QUESTIONS.length*100);
var opts="";
for(var i=0;i<CHOICES.length;i++){opts+='<button class="opt" onclick="answer('+i+')">'+CHOICES[i].l+'</button>';}
/* 妖精：キャラごとに「その子らしいサイズと置き方の幅」を決めて、
   その幅の中でランダムに振る。だから毎回ちがうけど、破綻せえへん。
   ★向きのルール：右に置く子＝左向き画像／左に置く子＝右向き画像 */
var FAIRIES = [
  /* 飛ぶ子：軽やか。大きめでも重くない。高いとこも飛ぶ。出番多め */
  {img:"fairy.png",     face:"R", min:42, max:54, botMin:14, botMax:64, weight:3},
  {img:"IMG_9784.png",  face:"L", min:42, max:54, botMin:14, botMax:64, weight:3},
  /* 祈りの子：静か。下のほうにちょこん。中くらい */
  {img:"fairy-pray.png",face:"R", min:36, max:44, botMin:8,  botMax:30, weight:2},
  /* ほんとなん？の子：考えこんでる。下のほう。中くらい */
  {img:"IMG_9783.png",  face:"L", min:34, max:42, botMin:8,  botMax:34, weight:2},
  /* 指さしの子：存在感つよい。小さめ・端に寄せる・出番少なめ */
  {img:"fairy-point.png",face:"R",min:30, max:38, botMin:10, botMax:26, weight:1},
  {img:"IMG_9775.png",  face:"L", min:30, max:38, botMin:10, botMax:26, weight:1}
];
var ANIMS = ["fly1","fly2","fly3"];

function randomFairy(seed){
  function r(n,m){ var x=Math.sin(seed*97.13+n*41.7)*10000; return (x-Math.floor(x))*m; }
  /* 出番の多さ(weight)を踏まえて子を選ぶ */
  var bag=[];
  for(var i=0;i<FAIRIES.length;i++){
    for(var w=0;w<FAIRIES[i].weight;w++){ bag.push(FAIRIES[i]); }
  }
  var f = bag[Math.floor(r(1,bag.length))];
  /* 左向き画像は右側へ／右向き画像は左側へ（内を向く） */
  var side = (f.face==="L") ? "right" : "left";
  var size = Math.round(f.min + r(2, f.max-f.min+1));
  var bot  = Math.round(f.botMin + r(3, f.botMax-f.botMin+1));
  var off  = Math.round(2 + r(4,11));
  var anim = ANIMS[(seed + Math.floor(r(5,3))) % ANIMS.length];
  var dur  = (4.6 + r(6,3.2)).toFixed(1);
  var dly  = (r(7,2.4)).toFixed(1);
  var op   = (0.84 + r(8,0.14)).toFixed(2);
  return '<div class="fairy" style="width:'+size+'px;'+side+':'+off+'px;bottom:'+bot+'px;opacity:'+op+'">'+
         '<img src="'+f.img+'" alt="" style="animation:'+anim+' '+dur+'s ease-in-out '+dly+'s infinite">'+
         '</div>';
}

var fairy = randomFairy(qIdx+1);

 '<div class="bar-track"><div class="bar-prog" style="width:'+pct+'%"></div></div>'+

 '<p class="q-text">'+q.q+'</p>'+
 '<div class="opts">'+opts+'</div>'+
'</div>';
}

     '</div>'+
   '</div>'+
   '<p class="rest-why" style="color:'+t.color+'">'+t.why+'</p>'+
   '<button class="btn-detail" style="color:'+t.color+';border-color:'+t.border+'" onclick="toggleDetail(\''+t.id+'\')">タップで詳しく見る 👀</button>'+
   detailHTML(t)+
 '</div>';
}

/* 締め */
html+=
 '<div class="botan-msg">'+
   '<div class="botan-head">'+
     '<div class="botan-face"><img src="botan-profile.jpg" alt="" onerror="this.parentNode.innerHTML=\'🌙\'"></div>'+

   '<p class="msg-text">どの族が出ても、それ全部あなたの中にあるもの🥺<br>そして——どの族の奥にも、共通してあるのが<b>"脳の力み"</b>。<br><br>頑張れへんのやない。<b>脳が、ちょっと疲れてるだけ</b>かもしれん🌙</p>'+
